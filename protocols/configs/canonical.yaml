# Default settings of every campaign. A protocol overrides a value by naming it; a name that
# is not here and not a protocol key is rejected.
#
# Units: Strombom 2014 (Table 1) gives m and m per time step, no time unit; one tick = 1 s.
#
# "R_f" is the flock radius: the radius of the flock while one dog drives it, measured per
# N by the calibration at the start of a run (see Calibration below).

# The task every trial runs.
task: drive_to_goal

# --- Task: drive the flock into a goal -----------------------------------------------------
# The goal lies this many flock radii from the flock start. It is never closer than the minimum
# (in m) or closer than the widest start layout plus the goal plus one flock radius. The sign
# gives the direction; a negative value mirrors the drive.
drive_distance_multiple: 13.0
drive_distance_min: 80.0
# Goal radius in flock radii.
goal_radius_multiple: 1.9
# Share of the sheep that must be inside the goal at one tick for a trial to succeed. 1 is
# every sheep. At 0.99 one or two late sheep no longer decide a trial.
success_fraction: 1.0
# Free margin around the start, in m (a little more than the sheep reaction distance 65).
# The field only places the start; there is no boundary, as in the paper.
field_clearance: 80.0

# --- Start layouts -------------------------------------------------------------------------
# compact: a Gaussian with sigma = compact_spread x R_f, cut at 3 sigma.
compact_spread: 0.5
# The scattered layouts are sized by L = separation_scale x N^(2/3), the distance from the
# flock centre beyond which Strombom 2014 collects (r_a N^(2/3), r_a = 2).
separation_scale: 2.0
# wide: a Gaussian with sigma = wide_sigma x L, cut at 3 sigma.
wide_sigma: 0.5
# split: 3 compact clusters (2 when N < 12) on a ring of split_ring x L around the centre.
split_ring: 1.0
# outlier_rich: outlier_fraction of the sheep at outlier_near to outlier_far x L from a
# compact core.
outlier_fraction: 0.2
outlier_near: 1.1
outlier_far: 1.6

# --- Dogs ----------------------------------------------------------------------------------
# Tick-0 dog placement (arcs: even half-circles behind the flock; ring: full circles minus
# the goal cone; handler: all dogs at one point behind the flock). The inner arc lies
# dog_start_gap beyond the farthest starting sheep; dogs keep dog_start_spacing apart along
# an arc and between successive arcs.
dog_start: arcs
dog_start_gap: 30.0
dog_start_spacing: 5.0
# Distance (m) within which two dogs count as overlapping (dog_overlap metric); 2.0 is r_a.
dog_overlap_distance: 2.0

# --- Metrics -------------------------------------------------------------------------------
# Connected-component link distance (m) for fragmentation, and centroid distance (in R_f)
# beyond which a sheep counts as lost.
measurement_radius: 5.0
lost_radius_multiple: 2.5

# --- Calibration of R_f --------------------------------------------------------------------
# One dog drives a compact flock toward an unreachable goal for calibration_seconds. R_f is
# sqrt(2) x the RMS radius over the last calibration_window_seconds, taking the median across
# seeds and across start densities in calibration_starts (radius s x sqrt(N / pi) m).
calibration_seeds: 3
calibration_seconds: 300.0
calibration_window_seconds: 90.0
calibration_starts: [1.0, 3.0]
# Max relative drift between the last two windows and max relative spread across start sizes.
# At 0.05 every study size (N <= 566) passes at 3 and 20 seeds per start, while larger flocks
# fail from N = 630 (3 seeds) or N = 660 (20 seeds) once the flock outgrows the settle window.
# Excluded from the physics hash because tolerances only gate whether calibration stops.
settled_tolerance: 0.05
start_agreement: 0.05

# --- Seeds and decisions -------------------------------------------------------------------
# Seed i of every cell is master_seed + i, so cells share starting flocks.
master_seed: 2026
# A cell is reliable when its success-rate confidence interval lies at or above reliability_theta
# (51/51 successes at theta = 0.90, confidence = 0.99), unreliable when below, undecided otherwise.
reliability_theta: 0.90
confidence: 0.99
# Seeds are added in batches of batch_seeds up to max_seeds per undecided cell.
batch_seeds: 10
max_seeds: 200
# Paired-bootstrap finish-time equivalence margin (fraction of the slower median), minimum
# shared finished seeds required to compare two cells, and bootstrap resample count.
time_margin: 0.05
min_pairs: 5
bootstrap_resamples: 4000
# Insert a midpoint D between neighbouring dog counts more than refine_min_gap apart when
# their zones differ (or when their reliability differs if decide_finish_times is false).
refine_min_gap: 1
# False: allocate seeds only for reliability (D_min). True: also resolve finish-time regimes
# (D_best, D_sat, D_crowd).
decide_finish_times: false
# Stop adding seeds to a reliable, non-slowed cell above the saturation team once its mean
# dog_overlap reaches this threshold (> 1 disables pruning).
prune_overlap: 0.9
# Number of initial seeds per cell whose per-tick history is saved as Parquet.
timeseries_seeds: 3
# Wall-clock limit (hours, excluding calibration) after which no new batch is started.
budget_hours: 72.0
