# ==============================================================================================
# Canonical Experiment Configuration Defaults
# ==============================================================================================
# Base configuration defaults shared by all experimental protocols.
#
# Protocols override specific values by explicitly defining them in their protocol YAML file.
# Any key specified in a protocol that is not defined here or in the protocol schema is rejected.
#
# Coordinate and Physical Unit Conventions:
# - Length: 1 unit = 1 meter.
# - Time: 1 tick = 1 model second by default (dt = 1.0 s for Strömböm, 0.05 s for Kubo,
#   0.03 s for Lama). Multi-model comparisons are evaluated in physical seconds.
# - R_f: Characteristic driven flock radius for a given flock size N, determined empirically
#   at the start of each campaign via the single-herder calibration routine.
# ==============================================================================================

task: drive_to_goal

# ----------------------------------------------------------------------------------------------
# Task Scenario: Drive to Goal
# ----------------------------------------------------------------------------------------------
# Multiplier specifying distance from flock initial centroid to the goal center in units of R_f.
# Sizing is bounded below by drive_distance_min and start-layout extent. Negative values mirror
# the drive along the horizontal axis.
drive_distance_multiple: 13.0
drive_distance_min: 80.0

# Radius of the destination goal disc, expressed in multiples of calibrated flock radius R_f.
goal_radius_multiple: 1.9

# Fraction of the flock required inside the goal simultaneously for a trial to succeed.
# 1.0 requires every sheep (strict success); lower values (e.g. 0.99) tolerate stray outliers.
success_fraction: 1.0

# Required holding duration inside the goal disc (in multiples of expected drive time).
# 0.0 indicates immediate success upon entry without requiring a holding period.
hold_drive_multiple: 0.0

# Whether shepherds withdraw to a standoff distance (r_s + r_a) once the flock enters the goal.
# Allows the flock to settle without shepherds pushing them through or out of the goal area.
hold_withdraw: false

# Minimum inter-shepherd clearance distance. Shepherds cannot move within this distance of
# each other. 0.0 treats shepherds as point agents without collision or volume constraints.
dog_spacing: 0.0

# Local perception range of shepherds. 0.0 gives global vision of all sheep in the world.
sensing_range: 0.0

# Inter-shepherd communication strategy:
# - 'none': Each shepherd acts solely on local observations.
# - 'neighbour': Shepherds pool observations with peers within their sensing_range.
# - 'shared': Global perception pooling across all active shepherds.
communication: none

# Standoff offset distance cap behind the flock center during drive mode. 0.0 leaves the
# model's standard scaling uncapped (r_a * sqrt(N)).
drive_offset_cap: 0.0

# Clearance margin (in meters) surrounding initial agent positions to prevent arena collisions.
field_clearance: 80.0

# ----------------------------------------------------------------------------------------------
# Task Scenario: Gather
# ----------------------------------------------------------------------------------------------
# Initial dispersion radius of targets and shepherds uniformly distributed around the goal.
gather_start_radius: 50.0

# Radius of the central collection goal, expressed as a fraction of gather_start_radius.
gather_goal_fraction: 0.2

# ----------------------------------------------------------------------------------------------
# Flock Initial Spatial Formations
# ----------------------------------------------------------------------------------------------
# Gaussian standard deviation multiplier for the compact layout: sigma = compact_spread * R_f.
compact_spread: 0.5

# Base scaling factor for dispersed layouts: L = separation_scale * N^(2/3).
separation_scale: 2.0

# Gaussian standard deviation multiplier for the wide layout: sigma = wide_sigma * L.
wide_sigma: 0.5

# Radius of the ring on which cluster centers are placed in the split layout (in units of L).
split_ring: 1.0

# Fraction of flock placed as distant outlier agents in the outlier_rich layout.
outlier_fraction: 0.2

# Inner and outer radial boundaries (in units of L) for outlier placement in outlier_rich.
outlier_near: 1.1
outlier_far: 1.6

# ----------------------------------------------------------------------------------------------
# Shepherd Initial Staging and Formations
# ----------------------------------------------------------------------------------------------
# Initial spatial deployment pattern for shepherds at tick 0:
# - 'arcs': Concentric semi-circular arcs positioned behind the flock away from the goal.
# - 'ring': Circular ring surrounding the flock, excluding the goal-facing cone.
# - 'handler': Single staging point positioned behind the flock on the drive axis.
dog_start: arcs

# Radial clearance distance from the outermost sheep boundary to the first shepherd arc.
dog_start_gap: 30.0

# Arc distance between adjacent shepherd stations along a deployment ring or arc.
dog_start_spacing: 5.0

# Proximity threshold below which two shepherds are considered redundant duplicate agents.
dog_overlap_distance: 2.0

# ----------------------------------------------------------------------------------------------
# Measurement Metrics and Trajectory Logging
# ----------------------------------------------------------------------------------------------
# Inter-sheep distance threshold for clustering agents into connected sub-flocks.
measurement_radius: 5.0

# Radial distance from the centroid in multiples of R_f beyond which a sheep is considered lost.
lost_radius_multiple: 2.5

# Step interval for logging metric snapshots. 1 logs every simulation tick.
metrics_stride: 1

# ----------------------------------------------------------------------------------------------
# Flock Radius Calibration Parameters (R_f)
# ----------------------------------------------------------------------------------------------
# Number of independent random seeds evaluated per calibration condition.
calibration_seeds: 3

# Simulated duration in seconds for driving the flock during steady-state calibration.
calibration_seconds: 300.0

# Final time window in seconds over which steady-state root-mean-square radius is calculated.
calibration_window_seconds: 90.0

# Initial flock density spacings tested to verify convergence across different initial spreads.
calibration_starts: [1.0, 3.0]

# Maximum allowable fractional drift in R_f between consecutive evaluation windows.
settled_tolerance: 0.15

# Maximum allowable fractional discrepancy in R_f across different initial spacings.
start_agreement: 0.25

# Flock size N above which R_f is analytically scaled rather than simulated. 0 disables this.
impose_radius_above: 0

# Multiplier applied when using analytical constant-density scaling R_f(N) ~ sqrt(N).
imposed_radius_scale: 1.0

# ----------------------------------------------------------------------------------------------
# Experiment Random Seeds and Adaptive Refinement
# ----------------------------------------------------------------------------------------------
# Base random seed. Individual trial seed for seed_index i is master_seed + i.
master_seed: 2026

# Success rate threshold theta for classifying an operational cell as reliable.
reliability_theta: 0.90

# Statistical confidence level (1 - alpha) used for Clopper-Pearson binomial tests.
confidence: 0.99

# Number of trial seeds evaluated per batch increment in an adaptive refinement round.
batch_seeds: 10

# Maximum number of seeds allocated to an individual cell before sampling stops.
max_seeds: 200

# Fractional threshold for considering two completion times statistically indistinguishable.
time_margin: 0.05

# Minimum paired successful seeds required to perform paired bootstrap completion comparisons.
min_pairs: 5

# Number of bootstrap resamples used for paired time difference confidence intervals.
bootstrap_resamples: 4000

# Minimum shepherd gap between adjacent D points required before inserting an intermediate D.
refine_min_gap: 1

# Whether adaptive rounds allocate seeds to resolve completion time comparisons (D_sat, D_best).
# false resolves only reliability (D_min); true also resolves saturation and completion speeds.
decide_finish_times: false

# Overlap threshold above which saturated cells with redundant shepherds are pruned.
prune_overlap: 0.9

# Number of initial seeds per cell that save complete per-tick trajectory histories as Parquet.
timeseries_seeds: 3

# Maximum execution time budget in hours before stopping new batch dispatches.
budget_hours: 72.0
