# Default settings of every campaign. A protocol overrides a value by naming it; a name that
# is not here and not a protocol key is rejected.
#
# Units: Strombom 2014 is dimensionless, read here as 1 unit = 1 m and one tick = 1 s.
# Kubo 2022 gives no length unit and is read the same way, with its own tick of 0.05 s, so
# times are compared in seconds.
#
# "R_f" is the flock radius: the radius of the flock while one dog drives it, measured per
# method and N by the calibration at the start of a run (see Calibration below).

task: drive_to_goal

# --- Task: drive the flock into a goal -----------------------------------------------------
# The goal lies this many flock radii from the flock start, and never closer than the minimum
# (in units) or closer than the widest start layout plus the goal plus one flock radius.
# The sign gives the direction; a negative value mirrors the drive.
drive_distance_multiple: 13.0
drive_distance_min: 80.0
# Goal radius in flock radii.
goal_radius_multiple: 1.9
# Share of the sheep that must be inside the goal at one tick for a trial to succeed. 1 is every
# sheep, as in both papers. Below 1 (0.99), one or two stragglers no longer decide a trial: with
# the strict rule a flock can reach the goal with 99% inside and then be driven past it.
success_fraction: 1.0
# Free margin around the start, in units (a little more than the sheep reaction distance 65).
# The field only places the start; there is no boundary, as in both papers.
field_clearance: 80.0

# --- Start layouts -------------------------------------------------------------------------
# compact: a Gaussian with sigma = compact_spread x R_f, cut at 3 sigma.
compact_spread: 0.5
# The scattered layouts are sized by L = separation_scale x N^(2/3), the distance from the
# flock centre beyond which Strombom 2014 collects (r_a N^(2/3), r_a = 2).
separation_scale: 2.0
# wide: a Gaussian with sigma = wide_sigma x L, cut at 3 sigma.
wide_sigma: 0.5
# split: 3 compact clusters (2 when N < 12) on a ring of split_ring x L around the centre.
split_ring: 1.0
# outlier_rich: outlier_fraction of the sheep at outlier_near to outlier_far x L from a
# compact core.
outlier_fraction: 0.2
outlier_near: 1.1
outlier_far: 1.6

# --- Dogs ----------------------------------------------------------------------------------
# Where the dogs stand at tick 0, a convention with no real-world rule behind it (a real dog
# starts at the handler, far from the sheep, and runs out round the flock).
#   arcs:    half circles behind the flock, spread evenly (the base)
#   ring:    full circles round the flock, goal side included
#   handler: every dog at one point straight behind the flock, as if released from a post
# The first circle is dog_start_gap beyond the farthest sheep that can start. A circle holds as
# many dogs as fit dog_start_spacing apart; more dogs go on the next one, dog_start_spacing
# farther out. The gap and the spacing are conventions; the sensitivity protocols sweep them.
dog_start: arcs
dog_start_gap: 30.0
dog_start_spacing: 5.0
# A dog with another dog closer than this has a twin (dog_overlap metric). The adaptive run
# uses it to stop spending seeds on copies of a dog. 2 is the Strombom interaction distance r_a.
dog_overlap_distance: 2.0

# --- Metrics -------------------------------------------------------------------------------
# Sheep closer than measurement_radius are in the same group (fragmentation). Sheep farther
# than lost_radius_multiple x R_f from the centroid count as lost.
measurement_radius: 5.0
lost_radius_multiple: 2.5

# --- Calibration of R_f --------------------------------------------------------------------
# One dog drives a compact flock toward a goal it cannot reach for calibration_seconds. R_f is
# sqrt(2) x the RMS radius over the last calibration_window_seconds, median over seeds and
# over the start sizes (spacings, so a start has radius spacing x sqrt(N / pi)).
calibration_seeds: 3
calibration_seconds: 300.0
calibration_window_seconds: 90.0
calibration_starts: [1.0, 3.0]
# Calibration raises when R_f changed by more than settled_tolerance between the last two
# windows, or differs by more than start_agreement between the start sizes. Strombom sheep
# settle up to N = 400, so N stops there.
settled_tolerance: 0.15
start_agreement: 0.25

# --- Seeds and decisions -------------------------------------------------------------------
# Seed i of every cell is master_seed + i, so cells share start flocks.
master_seed: 2026
# A cell is reliable when the confidence interval of its success rate lies at or above theta,
# unreliable when it lies below, undecided otherwise. At theta 0.90 and 99% confidence a cell
# needs 51 straight successes to be reliable.
reliability_theta: 0.90
confidence: 0.99
# Seeds are added in batches until every open cell is decided or has max_seeds.
batch_seeds: 10
max_seeds: 200
# Two finish times are the same when their paired median difference is within time_margin of
# the slower median (paired bootstrap, bootstrap_resamples draws). min_pairs is the fewest
# shared finished seeds a comparison accepts.
time_margin: 0.05
min_pairs: 5
bootstrap_resamples: 4000
# A dog count is added halfway between two neighbours more than refine_min_gap apart whose
# zones differ (whose reliability differs, when decide_finish_times is false).
refine_min_gap: 1
# false: seeds are spent only to decide reliability, so D_min. An open finish-time comparison
# (D_best, D_sat, D_crowd) asks for no seeds; those values stay in the tables, flagged
# undecided. true: also decide them, which costs about a third more trials. dmin_m12 was run
# with true, every later run with false.
decide_finish_times: false
# Above a confirmed saturation, a cell whose dogs were copies (mean dog_overlap at least
# this) and that is neither slower nor unreliable gets no more seeds. Above 1 turns it off.
prune_overlap: 0.9
# The first timeseries_seeds seeds of every cell keep their per-tick history as Parquet.
timeseries_seeds: 3
# A run starts no new batch after this many hours (calibration not counted). Trials are saved
# as they finish and a rerun continues where it stopped.
budget_hours: 72.0
