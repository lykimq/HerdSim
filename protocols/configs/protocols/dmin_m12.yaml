# D_min at 12 drive times, the loosest of the three deadlines. A drive time is the drive
# length over the sheep speed. Strombom sheep, the team rule, four layouts, N 25 to 400,
# D 1 to 24 (a midpoint D is added where the zone changes).
#
# This run was made with decide_finish_times true; add it to reproduce its seed allocation.

protocol_id: dmin_m12
description: "D_min against N on four start layouts, strict rule, 12 drive times."
output: results/dmin_m12
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0

layouts: [compact, wide, split, outlier_rich]
flock_sizes: [25, 50, 100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16, 24]
