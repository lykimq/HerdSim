# D_min at 12 drive times, the loosest of the three main deadlines (dmin_m6 and dmin_m3
# differ only in the deadline). A drive time is the drive length over the sheep speed.
#
# Strombom sheep and the multi-dog rule, point dogs, global view, four layouts, N 25 to 400
# (dmin_f99_m12 adds more sizes), D 1 to 24 (the hardest cells may need more than the
# pilot's 16; a midpoint D is added where the zone changes), theta 0.90 at 99 percent
# confidence.
#
# This run was made with decide_finish_times true; the canonical default is false. Add
# decide_finish_times: true to reproduce its seed allocation exactly.

protocol_id: dmin_m12
description: "Main grid at 12 drive times, strict rule: D_min against N on four start layouts (RQ1 to RQ3)."
output: results/dmin_m12
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0

layouts: [compact, wide, split, outlier_rich]
flock_sizes: [25, 50, 100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16, 24]
