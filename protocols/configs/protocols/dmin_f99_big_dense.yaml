# How much the imposed density decides the large-N answer: dmin_f99_big at N = 566 and
# 800, wide start, with the imposed radius scaled by 1 / sqrt(2), so the 800 flock
# is twice as dense as the 566 flock. One protocol per scale, because R_f is calibrated once
# per protocol and a factor cannot change it.

protocol_id: dmin_f99_big_dense
description: "dmin_f99_big at N 566 and 800 with the imposed flock radius scaled by 1/sqrt(2), a denser flock (RQ13)."
output: results/dmin_f99_big_dense
extends: dmin_f99_big.yaml

layouts: [wide]
flock_sizes: [566, 800]
imposed_radius_scale: 0.7071067811865476
