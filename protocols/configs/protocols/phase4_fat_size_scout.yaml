# Phase-4 size scout for fat (RQ4). Same freeze as Phase-1 size map.

extends: phase1_scout.yaml
protocol_id: phase4_fat_size_scout
phase: 4
output: results/phase4/fat_size/scout
methods:
  - fat
# Scout summary metrics stay on trials.csv; skip parquet to cut I/O.
# Claim windows keep timeseries (inherited from phase1_claim).
store_timeseries: false
# Package D needs baseline+kubo+fat together; build after all methods finish.
packages: [A, F]
