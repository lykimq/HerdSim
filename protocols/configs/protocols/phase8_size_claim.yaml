# Phase-8 size claim windows for collect-hold-gate.
# Grade: CLAIM. Run only after phase8/size/scout/trials.csv exists.
#
# Window selection reuses plan_claim_cells.py (same D_min / overcrowding rules
# as Phase 1). Claim rows replace scout rows on reseeded cells.

protocol_id: phase8_size_claim
phase: 8
grade: CLAIM
output: results/phase8/size/claim
canonical: protocols/configs/canonical_grid.yaml

task: collect_hold_gate
hold_ticks: 800
hold_center: [250.0, 250.0]
hold_radius_scale: 2.5
hold_radius_min: 23.0
hold_radius_max: 27.0
gate_half_width: 30.0

methods:
  - strombom_multi
layouts:
  - compact
flock_sizes: [5, 10, 25, 50, 75, 100, 150, 200, 300, 400]
shepherd_counts: [1, 2, 3, 4, 6, 10, 15, 20, 25, 35]
seeds: 100
seed_mode: claim
upstream_protocol: phase8_size_scout
# Summary metrics on trials.csv are enough for Package A / D_min.
# Skip parquet timeseries (RQ7-style) to cut I/O on claim reseeds.
store_timeseries: false
packages: [A]
