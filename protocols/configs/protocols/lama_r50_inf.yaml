# The paper's infinite-sensing case (Fig. 2a): every herder sees every target and herder, so
# there is no threshold and N* grows as sqrt(M) over the whole range. Grid, limit and share
# of lama_r50.

protocol_id: lama_r50_inf
description: "lama_r50 with infinite sensing: every herder sees every target and herder (RQ14)."
output: results/lama_r50_inf
extends: lama_r50.yaml

methods:
  lama:
    time_limit_ticks: 166667
    params:
      sensing_radius: .inf
