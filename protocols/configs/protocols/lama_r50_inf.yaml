# The paper's infinite-sensing case (Fig. 2a): every herder sees every target and every herder,
# so there is no threshold and N* grows as sqrt(M) over the whole range (about 0.9 sqrt(M) read
# from the figure). Same grid, limit and share as lama_r50.

protocol_id: lama_r50_inf
output: results/lama_r50_inf
extends: lama_r50.yaml

methods:
  lama:
    time_limit_ticks: 166667
    params:
      sensing_radius: .inf
