# dmin_f99_big with the drive offset capped at r_s - r_a = 63 (a HerdSim variant of the paper
# rule; plan design_min_max section 7). In dmin_f99_big no D drives the flock from N = 1131 on:
# the paper's drive point r_a sqrt(N) lies beyond the sheep reaction distance r_s = 65 from
# N = (r_s / r_a)^2 = 1056, so the dogs stand where only the nearest sheep feel them. With the
# cap the dogs drive from within reach, so D_min above 1056 can be measured at all. N = 800 is
# kept as the overlap with dmin_f99_big (the cap does not act there: r_a sqrt(800) = 56.6).

protocol_id: dmin_f99_big_cap
output: results/dmin_f99_big_cap
extends: dmin_f99_big.yaml

# N = 2263 and 3200 were dropped on 2026-10-24 after the first two hours: a wide trial there runs
# to its full deadline (7,000 to 8,800 ticks of thousands of sheep) and the run would have taken
# days. The 3200 trials already stored stay in the folder (compact 42 of 42 succeed, wide 0 of 58
# at D = 2 to 12) and are read as a lower bound; the campaign ignores groups it no longer lists.
flock_sizes: [800, 1131, 1600]
drive_offset_cap: 63.0
