# dmin_f99_big with the drive offset capped at r_s - r_a = 63, a HerdSim variant of the
# paper rule.
#
# The paper's drive point r_a sqrt(N) lies beyond the reaction distance r_s = 65 from
# N = (r_s / r_a)^2 = 1056, so in dmin_f99_big no team drives the flock from N = 1131 on.
# With the cap the dogs drive from within reach. N = 800 is the overlap with dmin_f99_big
# (the cap does not act there: r_a sqrt(800) = 56.6).

protocol_id: dmin_f99_big_cap
description: "dmin_f99_big at N 800 to 1600 with the drive offset capped at 63 m, a HerdSim variant of the paper rule (RQ13)."
output: results/dmin_f99_big_cap
extends: dmin_f99_big.yaml

# No N = 2263 or 3200: a failing wide trial there runs to its full deadline and the run would
# take days. The 3200 trials already in the folder (compact 42 of 42, wide 0 of 58 at D 2 to
# 12) are read as a lower bound; the campaign ignores groups it no longer lists.
flock_sizes: [800, 1131, 1600]
drive_offset_cap: 63.0
