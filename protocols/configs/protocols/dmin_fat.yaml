# D_min for the FAT dog rule: every dog aims behind the sheep farthest from the goal, with no
# coordination. Grid, deadline and seeds of dmin_m6, so each cell is the same task as the
# strombom_multi cell beside it.
#
# calibrate_as: FAT's own single dog settles a looser flock (R_f up to 28 percent larger at
# N = 400), which would enlarge its goal and drive. Calibrating with the paper shepherd keeps
# the R_f of dmin_m6, so only the dog rule differs.

protocol_id: dmin_fat
output: results/dmin_fat
extends: dmin_m6.yaml

methods:
  fat:
    time_limit_drive_multiple: 6.0
    calibrate_as: strombom_multi
