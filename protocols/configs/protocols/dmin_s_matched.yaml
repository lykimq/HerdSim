# Sensitivity: the field-matched sheep set of Strombom 2014 (their figure 5): r_a 1, noise
# 0.1 and reaction distance 75 instead of Table 1's 2, 0.3 and 65. Grid and deadline of
# dmin_s_base.
#
# A smaller r_a gives a tighter flock (radius 6.6 against 9.1 at N = 100) and halves the
# drive offset r_a sqrt(N) and the stop distance 3 r_a, both far larger than a real dog's
# working distance. The layouts are sized by r_a N^(2/3), so separation_scale follows r_a,
# and so does the twin distance of the dog_overlap metric.

protocol_id: dmin_s_matched
output: results/dmin_s_matched
extends: dmin_s_base.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0
    params: {r_a: 1.0, noise_strength: 0.1, r_s: 75.0}

separation_scale: 1.0
dog_overlap_distance: 1.0
