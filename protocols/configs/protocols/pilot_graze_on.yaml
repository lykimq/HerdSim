# dmin_f99_m6 with grazing repulsion on, on three of its flock sizes: a pilot of whether the
# paper's repulsion between grazing sheep changes D_min. Seed i draws the same flock as in
# dmin_f99_m6, scaled by this run's own R_f, and the four layouts and the dog grid are kept because they size the field and
# the drive, so each cell compares with the stored cell of dmin_f99_m6.

protocol_id: pilot_graze_on
description: "Pilot: dmin_f99_m6 with grazing repulsion on, N 50, 100 and 200."
output: results/pilot_graze_on
extends: dmin_f99_m6.yaml

# Strombom et al. (2014) repel sheep from each other at any distance from the dog (section 2).
methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0
    params:
      graze_repulsion: true

flock_sizes: [50, 100, 200]
