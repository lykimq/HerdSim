# dmin_f99_m6 with grazing repulsion on, testing whether repulsion between grazing sheep
# changes D_min. Layouts, dog grid, and master_seed match dmin_f99_m6 so cells compare
# directly after scaling by this run's calibrated R_f.

protocol_id: pilot_graze_on
description: "Pilot: dmin_f99_m6 with grazing repulsion on, N 50, 100 and 200."
output: results/pilot_graze_on
extends: dmin_f99_m6.yaml

# Strombom et al. (2014) repel sheep from each other at any distance from the dog (section 2).
methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0
    params:
      graze_repulsion: true

# Three mid-range anchor sizes from dmin_f99_m6; pilot_graze_on_rest covers the remaining six.
flock_sizes: [50, 100, 200]
