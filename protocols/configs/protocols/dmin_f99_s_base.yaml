# Sensitivity reference with success at 99 percent of the flock in the goal: dmin_s_base.yaml with
# the rule of dmin_f99_m12.yaml. The strict runs of the sensitivities hit a ceiling in some
# settings (success near 0.9 whatever D, because a straggler left outside the goal fails the
# trial), so the settings where that matters are repeated with this rule.

protocol_id: dmin_f99_s_base
output: results/dmin_f99_s_base
extends: dmin_s_base.yaml

success_fraction: 0.99
