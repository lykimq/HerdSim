# Cohesion c = 1.3: Strombom's attraction weight raised from the paper's 1.05.
# Otherwise dmin_f99_m12 on the five main flock sizes, so the slope of D_min against N
# compares on the same sizes; R_f is calibrated for this level.
#
# Why these levels: c below 1 does not calibrate (one dog breaks the flock), so no weaker c
# is run. Finish-time seeds off: only D_min is compared across levels.

protocol_id: dmin_f99_c1.3
output: results/dmin_f99_c1.3
extends: dmin_f99_m12.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0
    params:
      c: 1.3

flock_sizes: [25, 50, 100, 200, 400]
decide_finish_times: false
