# Cohesion level c = 2.0 (plan design_min_max section 3, RQ-F2): the sheep attraction weight of
# Strombom 2014 (1.05 in the paper) raised to 2.0. Everything else as dmin_f99_m12 (12 drive times,
# 99 percent rule, four layouts, seeds), on the five flock sizes 25 to 400 of the main runs, so
# the slope of D_min against N compares with dmin_f99_m12 on the same sizes. R_f is calibrated
# for this level (each level drives its own flock size). The probe of 2026-10-23 found this
# level calibrates cleanly; c below 1 does not (one dog breaks the flock), so no weaker c is run.
# Finish-time seeds off: only D_min is compared across levels.

protocol_id: dmin_f99_c2.0
output: results/dmin_f99_c2.0
extends: dmin_f99_m12.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0
    params:
      c: 2.0

flock_sizes: [25, 50, 100, 200, 400]
decide_finish_times: false
