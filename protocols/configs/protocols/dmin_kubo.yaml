# D_min for the Kubo 2022 force model (sheep and dogs): does the growth with N seen for
# strombom_multi hold for another sheep model?
#
# Compact start only, N 25 to 100, D 1 to 10, deadline 500 s (the paper's window). The
# scattered layouts are sized by Strombom's collect distance, which means nothing for sheep
# that attract within 20. N stops at 100 because the Kubo flock packs to a radius of about
# 5.8 at any N. The model has no noise, so seeds change only the start. The deadline is in
# seconds because the Kubo drive time is set by a speed cap the sheep rarely reach.

protocol_id: dmin_kubo
description: "The Kubo 2022 force model on compact starts with a 500 s limit: does another sheep model need the same teams? (RQ1)"
output: results/dmin_kubo
canonical: protocols/configs/canonical.yaml

methods:
  kubo:
    time_limit_seconds: 500

layouts: [compact]
flock_sizes: [25, 50, 100]
shepherd_counts: [1, 2, 3, 4, 6, 10]
