# D_min pilot: where does the deadline make D_min vary?
#
# Four layouts, N 50 to 400, D 1 to 16, one batch of 10 seeds per cell. One run at a loose
# deadline (12 drive times) answers every tighter one, since a trial that finishes inside a
# tighter deadline succeeds under it too (cli/dmin_report.py). Cells stay mostly undecided;
# the pilot fixed the deadlines and D grid of the main runs.

protocol_id: dmin_pilot
description: "Pilot: one batch of 10 seeds per cell at 12 drive times, read at tighter deadlines to choose the grid of the main runs."
output: results/dmin_pilot
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0

layouts: [compact, wide, split, outlier_rich]
flock_sizes: [50, 100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16]

batch_seeds: 10
max_seeds: 10
timeseries_seeds: 0
budget_hours: 6.0
