# D_min pilot: where does the deadline make D_min vary?
#
# One run at a loose deadline (12 drive times, the drive time being the drive length over the
# sheep speed). Every trial that finishes inside a tighter deadline also succeeds under it, so
# the trials of this run are read at tighter deadlines with cli/dmin_report.py. Ten seeds per
# cell, one batch, so cells are mostly undecided at the real thresholds; the pilot reads
# success rates and the pattern of D_min across layouts, N and deadline, and fixes the
# deadlines and the D grid of the main protocol.

protocol_id: dmin_pilot
output: results/dmin_pilot
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0

layouts: [compact, wide, split, outlier_rich]
flock_sizes: [50, 100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16]

batch_seeds: 10
max_seeds: 10
timeseries_seeds: 0
budget_hours: 6.0
