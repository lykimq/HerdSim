# Holding small flocks with a larger goal. In dmin_f99_hold no team holds a flock of 25 or 50:
# the flock enters at the near edge and keeps walking while the dogs withdraw out of r_s
# (13 to 17 m in 26 to 29 s), and below N = 100 the 99 percent share is every sheep, so the
# first sheep past the far edge ends the hold and calls the dogs back. A goal of 1.9 R_f is
# 11.8 m at N = 25 and 14.4 m at N = 50, too small for that walk; at N = 100 it is 17.3 m and
# holding works.
#
# Factor goal_radius_multiple: 1.9 (the level of dmin_f99_hold, so its cells must come out
# as there on the shared seeds), 2.5 and 3.0. N = 100 is the control where 1.9 already holds.
# Otherwise as dmin_f99_hold; the largest D is kept at 24 so the field is the same.

protocol_id: dmin_f99_hold_goal
description: "Holding small flocks: goal radius 1.9, 2.5 and 3.0 R_f at N 25 to 100 (RQ10)."
output: results/dmin_f99_hold_goal
extends: dmin_f99_hold.yaml

flock_sizes: [25, 50, 100]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16, 24]

factors:
  goal_radius_multiple: [1.9, 2.5, 3.0]
