# (hold_withdraw). Field, seeds and deadline of dmin_f99_m6; the 6 drive times now include
# the hold.
#
# N 25 to 400. D adds 7, 9, 10, 11 and 13 around the drive-arc capacity D_cap = 7 to 12.
# Finish-time seeds off: D_overcrowd and D_max rest on reliability alone.

protocol_id: dmin_f99_hold
description: "Holding: 99 percent of the flock must stay in the goal for one drive time while the dogs withdraw (RQ10)."
output: results/dmin_f99_hold
extends: dmin_f99_m6.yaml

hold_drive_multiple: 1.0
hold_withdraw: true
flock_sizes: [25, 50, 100, 200, 400]
