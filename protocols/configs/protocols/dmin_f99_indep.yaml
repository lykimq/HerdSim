# D_min for independent paper shepherds: every dog runs the single-dog Strombom rule on the
# whole flock, with no team layer, so all dogs aim at the same point. Task of dmin_f99_fat.
#
# Beside FAT (no team layer, no collect/drive switch) it shows what the switch alone gives;
# beside strombom_multi, what the team layer adds. The paper shepherd is this method's
# single dog, so calibrate_as gives it the R_f of dmin_f99_m6. Finish-time seeds on, so
# D_sat is decided too.

protocol_id: dmin_f99_indep
description: "Independent shepherds: every dog runs Strombom's single-dog rule, with no team layer, on the task of dmin_f99_fat (RQ9)."
output: results/dmin_f99_indep
extends: dmin_f99_fat.yaml

methods:
  independent:
    time_limit_drive_multiple: 6.0
    calibrate_as: strombom_multi

decide_finish_times: true
