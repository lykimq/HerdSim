# dmin_m12 with success at 99 percent of the flock in the goal. Seed i is the same flock as
# in dmin_m12, so the two runs compare cell by cell.

protocol_id: dmin_f99_m12
description: "D_min against N on four start layouts, 99 percent rule, 12 drive times, nine sizes."
output: results/dmin_f99_m12
extends: dmin_m12.yaml

success_fraction: 0.99

# Gives seeds to cells whose finish time is still being compared with a neighbour.
decide_finish_times: true
# The log midpoints 71, 141, 283 and 566 = 400 sqrt(2) give D_min(N) more points to fit.
# The flock has no settled size above about 600, so no larger N.
flock_sizes: [25, 50, 71, 100, 141, 200, 283, 400, 566]
