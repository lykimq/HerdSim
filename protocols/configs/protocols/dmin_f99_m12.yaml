# D_min with success at 99 percent of the flock in the goal, deadline 12 drive times.
#
# Same grid, seeds and physics as dmin_m12.yaml except for the success rule: a trial ends when 99
# percent of the sheep are inside the goal at one tick, where dmin_m12 needs every sheep. The
# strict rule turned out to decide many cells on the last one or two sheep (a flock can reach the
# goal with 99 percent inside and be driven past it), so this run asks the same question with a
# rule that a straggler cannot decide. Seed i is the same flock as in dmin_m12, so the two runs
# compare cell by cell. dmin_f99_m6 and dmin_f99_m3 differ from this file only in the deadline.

protocol_id: dmin_f99_m12
output: results/dmin_f99_m12
extends: dmin_m12.yaml

success_fraction: 0.99

# Resumed on 2026-10-23 with decide_finish_times true (report section 3.8): the earlier
# rounds ran with false, so the seeds added after that date go to the finish-time comparisons
# that decide D_sat, D_best and D_crowd. Reliability decisions already made do not change.
decide_finish_times: true
# Flock sizes added on 2026-10-23 (report section 3.8): the log midpoints 71, 141,
# 283 between 50, 100, 200, 400, and 566 = 400 sqrt(2), the next step of the same spacing. Every
# one was checked to calibrate cleanly: the six calibration runs agree within 2 percent. At 630
# one loose-start run stays 17 percent larger and at 700 the loose start keeps its size (spread
# 24 percent), so the model's edge lies between 600 and 630 and no larger N is added.
flock_sizes: [25, 50, 71, 100, 141, 200, 283, 400, 566]
