# dmin_f99_m6 with grazing repulsion on across the six flock sizes left out of pilot_graze_on.
# Layouts, dog grid, and master_seed match dmin_f99_m6 so the two pilots together cover all
# nine sizes of dmin_f99_m6.

protocol_id: pilot_graze_on_rest
description: "Pilot: dmin_f99_m6 with grazing repulsion on, N 25, 71, 141, 283, 400 and 566."
output: results/pilot_graze_on_rest
extends: dmin_f99_m6.yaml

# Strombom et al. (2014) repel sheep from each other at any distance from the dog (section 2).
methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0
    params:
      graze_repulsion: true

# The six sizes of dmin_f99_m6 not run in pilot_graze_on.
flock_sizes: [25, 71, 141, 283, 400, 566]
