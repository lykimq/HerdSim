# D_min above the calibration edge.
#
# Compact (the clean check of the flock size) and wide starts, N 566 to 3200 continuing the
# sqrt(2) spacing, D 1 to 12 (D_min is 2-3 at N = 566), 12 drive times, 99 percent rule.
# Finish-time seeds off.
#
# Up to N = 566 a power law and a curve that levels off both fit every D_min bracket; they
# part from about N = 1600 to 3200. Strombom flocks have a size of their own only up to
# N = 600, so above N_cal = 566 R_f is imposed at the density of the 566 flock,
# R_f(N) = R_f(566) sqrt(N / 566); every result above 566 is a result at that density.
# `cli/dmin_tables.py extent` compares each cell's flock with it.

protocol_id: dmin_f99_big
output: results/dmin_f99_big
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0

layouts: [compact, wide]
flock_sizes: [566, 800, 1131, 1600, 2263, 3200]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12]
success_fraction: 0.99
impose_radius_above: 566
