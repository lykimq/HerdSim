# Cohesion n_neighbors = 0.5N: each sheep is attracted to its nearest half of the flock
# instead of all N - 1, at the paper's c = 1.05. Otherwise as dmin_f99_c1.3.
#
# The one weaker cohesion that still gives a flock with one size under a driving dog
# (0.25N and below come apart).

protocol_id: dmin_f99_k05
description: "Weaker cohesion: each sheep is attracted to its nearest half of the flock (n_neighbors 0.5N) at 12 drive times (RQ11)."
output: results/dmin_f99_k05
extends: dmin_f99_m12.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0
    params:
      n_neighbors: "0.5N"

# N = 25 left out: with 13 neighbours the flock has no settled size (62 percent change
# between calibration windows). From N = 50 it settles.
flock_sizes: [50, 100, 200, 400]
decide_finish_times: false
