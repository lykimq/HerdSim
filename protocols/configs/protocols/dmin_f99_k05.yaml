# Cohesion level n_neighbors = 0.5N (plan design_min_max section 3, RQ-F2): each sheep is
# attracted to its nearest half of the flock instead of all N - 1 (the paper's global case), at
# the paper's c = 1.05. The one weaker cohesion that still gives a flock with one size under a
# driving dog (probe of 2026-10-23: 0.25N and below come apart). Otherwise as dmin_f99_c1.3.

protocol_id: dmin_f99_k05
output: results/dmin_f99_k05
extends: dmin_f99_m12.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 12.0
    params:
      n_neighbors: "0.5N"

# N = 25 is left out: with 13 neighbours the flock has no settled size (calibration runs of
# 7.8 to 16.1, 62 percent change between windows; checked 2026-10-23). From N = 50 it settles.
flock_sizes: [50, 100, 200, 400]
decide_finish_times: false
