# Sensitivity: the gap between the farthest start sheep and the first dog circle, 15, 30
# (base) and 60. A convention with no real-world value; this checks that D_min does not
# depend on it. Grid and deadline of dmin_s_base.

protocol_id: dmin_s_gap
description: "Sensitivity: the gap between the start flock and the first dog circle, 15, 30 and 60 m (RQ5)."
output: results/dmin_s_gap
extends: dmin_s_base.yaml

factors:
  dog_start_gap: [15.0, 30.0, 60.0]
