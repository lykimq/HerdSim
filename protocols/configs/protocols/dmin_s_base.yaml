# Sensitivity reference: the base setting on the grid that the sensitivity protocols share.
#
# The dmin_s_* protocols each change one thing of the base setting and are compared with this
# run, cell by cell, on the same seeds. Grid: the two scattered layouts where D matters,
# N 100, 200 and 400, D 1 to 16, deadline 6 drive times, canonical theta 0.90 at 99%.
# A claim from the main protocols (dmin_m12, dmin_m6, dmin_m3) stands where this run and the
# sensitivity runs agree; where they differ, both are reported.

protocol_id: dmin_s_base
output: results/dmin_s_base
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0

layouts: [wide, outlier_rich]
flock_sizes: [100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16]
