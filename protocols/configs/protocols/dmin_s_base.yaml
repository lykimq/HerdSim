# Sensitivity reference: the base setting on the grid the dmin_s_* protocols share.
#
# Wide and outlier_rich starts (where D matters), N 100 to 400, D 1 to 16, 6 drive times.
# Each dmin_s_* run changes one thing and is compared with this one cell by cell on the
# same seeds. A claim from the main runs stands where this run and the sensitivity runs
# agree; where they differ, both are reported.

protocol_id: dmin_s_base
output: results/dmin_s_base
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 6.0

layouts: [wide, outlier_rich]
flock_sizes: [100, 200, 400]
shepherd_counts: [1, 2, 3, 4, 6, 8, 12, 16]
