name: CI/CD Pipeline

# Cheap gates only: unit/short tests, typecheck, frontend build.
# Do not run stress sims, scaling campaigns, or long experiment grids here.

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Run cheap backend suite
        run: make test-ci

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Typecheck Python
        run: make typecheck

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build frontend
        run: |
          cd platform/frontend
          npm ci
          npm run build
