name: CI/CD Pipeline

# Cheap gates for the scaling-cli branch: tests, lint, typecheck.
# Do not run stress sims or long campaign grids here.

on:
  push:
    branches: [ main, scaling-cli ]
  pull_request:
    branches: [ main, scaling-cli ]

# The jobs only read the code; a read-only token limits what a compromised action could do.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Lint
        run: make lint
      - name: Run test suite
        run: make test

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Typecheck Python
        run: make typecheck
