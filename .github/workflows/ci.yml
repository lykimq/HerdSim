name: CI/CD Pipeline

# Cheap gates for the scaling-cli branch: engine + scaling stack tests, lint, typecheck.
# Do not run stress sims or long campaign grids here.

on:
  push:
    branches: [ main, master, dev, scaling-cli ]
  pull_request:
    branches: [ main, master, scaling-cli ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Run cheap backend suite
        run: make test-ci

  python-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync Python deps
        run: uv sync --extra dev
      - name: Typecheck Python
        run: make typecheck
