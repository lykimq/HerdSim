<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="One cell">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">One cell = one (N, D) exam, repeated with seeds</text>
  <rect x="20" y="44" width="200" height="160" rx="8" fill="#fff" stroke="#ddd8ce"/>
  <text x="120" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Cell example</text>
  <text x="120" y="92" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">N = 100 sheep</text>
  <text x="120" y="114" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D = 1 dog</text>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">layout = compact</text>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">method = strombom_multi</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">T0 = 10,000 ticks</text>
  <text x="240" y="120" font-size="22" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
  <rect x="270" y="44" width="340" height="160" rx="8" fill="#fff" stroke="#ddd8ce"/>
  <text x="440" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">30 scout seeds (pass / fail)</text>
<circle cx="300" cy="92" r="9" fill="#2f6b45"/><circle cx="328" cy="92" r="9" fill="#2f6b45"/><circle cx="356" cy="92" r="9" fill="#2f6b45"/><circle cx="384" cy="92" r="9" fill="#9b2c2c"/><circle cx="412" cy="92" r="9" fill="#2f6b45"/><circle cx="440" cy="92" r="9" fill="#2f6b45"/><circle cx="468" cy="92" r="9" fill="#2f6b45"/><circle cx="496" cy="92" r="9" fill="#2f6b45"/><circle cx="524" cy="92" r="9" fill="#9b2c2c"/><circle cx="552" cy="92" r="9" fill="#2f6b45"/><circle cx="300" cy="120" r="9" fill="#2f6b45"/><circle cx="328" cy="120" r="9" fill="#2f6b45"/><circle cx="356" cy="120" r="9" fill="#2f6b45"/><circle cx="384" cy="120" r="9" fill="#2f6b45"/><circle cx="412" cy="120" r="9" fill="#2f6b45"/><circle cx="440" cy="120" r="9" fill="#2f6b45"/><circle cx="468" cy="120" r="9" fill="#2f6b45"/><circle cx="496" cy="120" r="9" fill="#2f6b45"/><circle cx="524" cy="120" r="9" fill="#2f6b45"/><circle cx="552" cy="120" r="9" fill="#2f6b45"/><circle cx="300" cy="148" r="9" fill="#2f6b45"/><circle cx="328" cy="148" r="9" fill="#2f6b45"/><circle cx="356" cy="148" r="9" fill="#2f6b45"/><circle cx="384" cy="148" r="9" fill="#2f6b45"/><circle cx="412" cy="148" r="9" fill="#9b2c2c"/><circle cx="440" cy="148" r="9" fill="#2f6b45"/><circle cx="468" cy="148" r="9" fill="#2f6b45"/><circle cx="496" cy="148" r="9" fill="#2f6b45"/><circle cx="524" cy="148" r="9" fill="#2f6b45"/><circle cx="552" cy="148" r="9" fill="#2f6b45"/>
  <text x="440" y="188" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">R = 27/30 = 0.90  (meets theta)</text>
  <text x="16" y="240" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Green = success (all sheep in goal). Red = timeout failure.</text>
  <text x="16" y="262" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Scout uses 30 seeds per cell. Claim windows use 100. Pattern above is illustrative of the idea, not one real Phase 1 cell.</text>
</svg>