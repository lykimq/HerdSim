<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="RQ2 size toy">
<rect x="0" y="0" width="720" height="330" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Toy: size and regimes (RQ2)</text>
<text x="16" y="44" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Same task; only flock size N changes. Look for D_min and what extra dogs do.</text>
<rect x="40" y="60" width="300" height="200" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="0"/>
<text x="190" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">Small N</text>
<line x1="70" y1="100" x2="310" y2="100" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="318" y="104" text-anchor="start" font-size="10" font-weight="400" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">theta</text>
<polyline points="80,180 120,120 160,108 200,105 240,108 280,112" fill="none" stroke="#2f6b45" stroke-width="2.5"/>
<line x1="120" y1="90" x2="120" y2="250" stroke="#2f6b45" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="120" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">D_min</text>
<text x="55" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">R</text>
<text x="190" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D</text>
<text x="190" y="288" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Extra dogs: still OK (waste path)</text>
<rect x="380" y="60" width="300" height="200" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="0"/>
<text x="530" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">Larger N (toy rise)</text>
<line x1="410" y1="100" x2="650" y2="100" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="658" y="104" text-anchor="start" font-size="10" font-weight="400" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">theta</text>
<polyline points="420,210 460,190 500,150 540,115 580,108 620,130" fill="none" stroke="#1f4e79" stroke-width="2.5"/>
<line x1="540" y1="90" x2="540" y2="250" stroke="#1f4e79" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="540" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">D_min</text>
<text x="395" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">R</text>
<text x="530" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D</text>
<text x="530" y="288" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Possible: D_min grows with N</text>
<text x="16" y="312" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Regimes along D: under-resourced -&gt; efficient -&gt; wasteful -&gt; overcrowding (if R falls).</text>
</svg>