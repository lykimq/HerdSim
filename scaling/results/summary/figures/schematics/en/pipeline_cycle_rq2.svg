<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980" role="img" aria-label="RQ2 pipeline cycle worked example">
<rect x="0" y="0" width="920" height="980" fill="#f7f6f2"/>
<text x="20" y="28" text-anchor="start" font-size="16" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Worked example: RQ2 baseline size map (strombom_multi, compact)</text>
<text x="20" y="48" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">One full cycle with the real grids, seed depths, windows, merge, and reuse used in this report.</text>
<rect x="20" y="66" width="880" height="118" fill="#e8f2eb" stroke="#2f6b45" stroke-width="2" rx="8"/>
<text x="36" y="92" text-anchor="start" font-size="14" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">1. Pilot (SMOKE)</text>
<text x="36" y="114" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Goal: check paths, metrics, resume before the real map.</text>
<text x="36" y="132" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Grid: N={5,10,25,50,100}  D={1,2,3,4,6,10}  layout=compact  seeds=5</text>
<text x="36" y="150" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Trials: 5 x 6 x 5 = 150. Result: pipeline OK, continue.</text>
<line x1="460" y1="184" x2="460" y2="202" stroke="#5c5852" stroke-width="2"/><polygon points="454,197 460,202 466,197" fill="#5c5852"/>
<rect x="20" y="206" width="880" height="118" fill="#fef3e7" stroke="#b45309" stroke-width="2" rx="8"/>
<text x="36" y="232" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">2. Scout (SCOUT)</text>
<text x="36" y="254" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Goal: cheap reliability map R(N,D) over the scientific grid.</text>
<text x="36" y="272" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Grid: full N (10 sizes) x full D (10 counts) x 30 seeds</text>
<text x="36" y="290" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Trials: 10 x 10 x 30 = 3,000.</text>
<text x="36" y="308" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Scout readout: N=5 and 10 need D_min=2; N at least 25 have D_min=1; no overcrowding pair.</text>
<line x1="460" y1="324" x2="460" y2="342" stroke="#5c5852" stroke-width="2"/><polygon points="454,337 460,342 466,337" fill="#5c5852"/>
<rect x="20" y="346" width="880" height="118" fill="#efece5" stroke="#5b4a2f" stroke-width="2" rx="8"/>
<text x="36" y="372" text-anchor="start" font-size="14" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">3. Claim plan (no new sims)</text>
<text x="36" y="394" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Rule: reseed D_min and its neighbors on the dog list.</text>
<text x="36" y="412" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">For N=5,10: D in {1,2,3}. For each N at least 25: D in {1,2}.</text>
<text x="36" y="430" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Selected cells: 22. Write boundary_cells.csv. No simulations here.</text>
<line x1="460" y1="464" x2="460" y2="482" stroke="#5c5852" stroke-width="2"/><polygon points="454,477 460,482 466,477" fill="#5c5852"/>
<rect x="20" y="486" width="880" height="118" fill="#e8f1f8" stroke="#1f4e79" stroke-width="2" rx="8"/>
<text x="36" y="512" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">4. Claim reseed (CLAIM)</text>
<text x="36" y="534" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Goal: precise R on the window cells only.</text>
<text x="36" y="552" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Grid: those 22 cells x 100 seeds</text>
<text x="36" y="570" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Trials: 22 x 100 = 2,200. T1 not run (no overcrowding cells).</text>
<line x1="460" y1="604" x2="460" y2="622" stroke="#5c5852" stroke-width="2"/><polygon points="454,617 460,622 466,617" fill="#5c5852"/>
<rect x="20" y="626" width="880" height="118" fill="#f3e8f8" stroke="#7b1fa2" stroke-width="2" rx="8"/>
<text x="36" y="652" text-anchor="start" font-size="14" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">5. Merge and analyse</text>
<text x="36" y="674" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Merge: each cell keeps one grade only.</text>
<text x="36" y="692" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">22 window cells use claim (100 seeds); other 78 cells keep scout (30 seeds).</text>
<text x="36" y="710" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Merged table: 22x100 + 78x30 = 4,540 rows. Packages and frontiers come from this merge.</text>
<line x1="460" y1="744" x2="460" y2="762" stroke="#5c5852" stroke-width="2"/><polygon points="454,757 460,762 466,757" fill="#5c5852"/>
<rect x="20" y="766" width="880" height="118" fill="#fce8e8" stroke="#9b2c2c" stroke-width="2" rx="8"/>
<text x="36" y="792" text-anchor="start" font-size="14" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">6. Reuse in later RQs</text>
<text x="36" y="814" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">RQ1: same cycle on 4 layouts at N={50,100,200} (smoke 600, scout 3,600, claim 2,400).</text>
<text x="36" y="832" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">RQ3: skipped (needs overcrowding cells; none on this map).</text>
<text x="36" y="850" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">RQ4: repeat size then structure for kubo and fat.</text>
<text x="36" y="868" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">RQ6 / RQ7: analyse-only on claim merges / timeseries (no new sims).</text>
<text x="20" y="962" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Stop after scout if the map is broken, the grid must change, or D_min bootstrap is too wide. Fix the protocol, then continue.</text>
</svg>
