<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-label="herdsim discoveries">
<rect x="0" y="0" width="780" height="430" fill="#f7f6f2"/>
<text x="16" y="26" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">What the HerdSim claim runs add (beyond one-controller demos)</text>
<rect x="16" y="44" width="240" height="160" fill="#fff" stroke="#b45309" stroke-width="2" rx="10"/>
<rect x="28" y="56" width="72" height="20" fill="#b45309" rx="4"/>
<text x="34" y="70" text-anchor="start" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1</text>
<text x="30" y="106" text-anchor="start" font-size="28" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">88%</text>
<text x="30" y="132" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Extra dogs mostly waste</text>
<text x="30" y="154" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Time flat ~183 ticks</text>
<text x="30" y="172" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">~146 path / dog on compact</text>
<text x="30" y="192" text-anchor="start" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Fig 2; regimes 88/10/2</text>
<rect x="270" y="44" width="240" height="160" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="10"/>
<rect x="282" y="56" width="72" height="20" fill="#7b1fa2" rx="4"/>
<text x="288" y="70" text-anchor="start" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Phase 2</text>
<text x="284" y="106" text-anchor="start" font-size="28" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Cost</text>
<text x="284" y="132" text-anchor="start" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">Structure hits cost first</text>
<text x="284" y="154" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Wide / outlier_rich inflate</text>
<text x="284" y="172" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">ticks and path; D_min still 1</text>
<text x="284" y="192" text-anchor="start" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Phase 2 cost tables</text>
<rect x="524" y="44" width="240" height="160" fill="#fff" stroke="#2f6b45" stroke-width="2" rx="10"/>
<rect x="536" y="56" width="72" height="20" fill="#2f6b45" rx="4"/>
<text x="542" y="70" text-anchor="start" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Phase 4</text>
<text x="538" y="106" text-anchor="start" font-size="28" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Mixed</text>
<text x="538" y="132" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Transfer is method-specific</text>
<text x="538" y="154" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Kubo shares compact D_min</text>
<text x="538" y="172" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">FAT does not scale</text>
<text x="538" y="192" text-anchor="start" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Phase 4 transfer counts</text>
<rect x="140" y="220" width="240" height="160" fill="#fff" stroke="#9b2c2c" stroke-width="2" rx="10"/>
<rect x="152" y="232" width="72" height="20" fill="#9b2c2c" rx="4"/>
<text x="158" y="246" text-anchor="start" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1</text>
<text x="154" y="282" text-anchor="start" font-size="28" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">N=5,10</text>
<text x="154" y="308" text-anchor="start" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">Tiny flocks fail differently</text>
<text x="154" y="330" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Oscillation / stuck at D=1</text>
<text x="154" y="348" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Fixed when D=2 (R to 1.00)</text>
<text x="154" y="368" text-anchor="start" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1 failure labels</text>
<rect x="400" y="220" width="240" height="160" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="10"/>
<rect x="412" y="232" width="72" height="20" fill="#1f4e79" rx="4"/>
<text x="418" y="246" text-anchor="start" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1</text>
<text x="414" y="282" text-anchor="start" font-size="28" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Width 0</text>
<text x="414" y="308" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">D_min can be certain</text>
<text x="414" y="330" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Bootstrap interval width 0</text>
<text x="414" y="348" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">on every baseline D_min</text>
<text x="414" y="368" text-anchor="start" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">dmin_bootstrap.csv</text>
<text x="16" y="418" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Numbers from Phases 1, 2, and 4 only. Full write-ups: sections 8 to 10.</text>
</svg>