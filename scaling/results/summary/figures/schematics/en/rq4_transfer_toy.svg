<text x="560" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">no D_min</text>
<text x="560" y="245" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">absent / fail?</text>
<text x="16" y="275" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Mark what is shared vs method-specific (shape, magnitude, or thresholds).</text>
