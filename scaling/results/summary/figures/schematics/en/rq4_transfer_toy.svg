<line x1="320" y1="110" x2="320" y2="200" stroke="#1f4e79" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="320" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">D_min</text>
<text x="350" y="245" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">same or shift?</text>
