<text x="110" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">D_min</text>
<text x="140" y="245" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">shared floor?</text>
