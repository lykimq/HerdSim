<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="campaign seed pipeline">
<rect x="0" y="0" width="760" height="230" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Campaign seed staging (shared pipeline)</text>
<rect x="20" y="48" width="128" height="110" fill="#fff" stroke="#2f6b45" stroke-width="2" rx="8"/>
<text x="84.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">1. Smoke</text>
<text x="84.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">tiny grid</text>
<text x="84.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">paths + resume</text>
<text x="157.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
<rect x="166" y="48" width="128" height="110" fill="#fff" stroke="#b45309" stroke-width="2" rx="8"/>
<text x="230.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">2. Scout</text>
<text x="230.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">full / factor grid</text>
<text x="230.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">30 seeds</text>
<text x="303.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
<rect x="312" y="48" width="128" height="110" fill="#fff" stroke="#5b4a2f" stroke-width="2" rx="8"/>
<text x="376.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">3. Claim plan</text>
<text x="376.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">no new sims</text>
<text x="376.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">pick windows</text>
<text x="449.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
<rect x="458" y="48" width="128" height="110" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="8"/>
<text x="522.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">4. Claim reseed</text>
<text x="522.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">frontier cells</text>
<text x="522.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">100 seeds</text>
<text x="595.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
<rect x="604" y="48" width="128" height="110" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="8"/>
<text x="668.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">5. Merge + analyse</text>
<text x="668.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">packages A-G</text>
<text x="668.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">claim-grade</text>
<text x="16" y="202" text-anchor="start" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1 example: scout 3,000 then claim 2,200; merge keeps claim rows on reseeded cells.</text>
<text x="16" y="218" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Stage depth only. Which phase runs which map is in phase_roadmap.svg.</text>
</svg>