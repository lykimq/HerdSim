<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="275" viewBox="0 0 680 275" role="img" aria-label="RQ5 information toy">
<rect x="0" y="0" width="680" height="275" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Toy: information ladders (RQ5)</text>
<text x="16" y="44" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Improve sensing or sharing; ask whether D_min can drop one grid step.</text>
<rect x="60" y="90" width="120" height="120" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="120" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">bearing</text>
<text x="120" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D_min = 3?</text>
<text x="120" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">toy</text>
<rect x="200" y="90" width="120" height="120" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="260" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">local</text>
<text x="260" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D_min = 2?</text>
<text x="260" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">toy</text>
<rect x="340" y="90" width="120" height="120" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="400" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">global</text>
<text x="400" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D_min = 1?</text>
<text x="400" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">toy</text>
<rect x="480" y="90" width="120" height="120" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="540" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">+ range / comm</text>
<text x="540" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">still 1?</text>
<text x="540" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">toy</text>
<text x="180" y="155" text-anchor="middle" font-size="18" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">-&gt;</text>
<text x="320" y="155" text-anchor="middle" font-size="18" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">-&gt;</text>
<text x="460" y="155" text-anchor="middle" font-size="18" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">-&gt;</text>
<text x="16" y="250" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">A real saving needs a defined D_min that falls when the ladder step improves.</text>
</svg>