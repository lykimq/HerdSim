<text x="230.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">luoi day du</text>
<text x="230.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">30 hat</text>
<text x="303.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
