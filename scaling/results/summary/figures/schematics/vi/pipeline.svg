<text x="376.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">3. Plan claim</text>
<text x="376.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">khong sim moi</text>
<text x="376.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">chon cua so</text>
<text x="449.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
