<text x="668.0" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">5. Hop nhat + phan tich</text>
<text x="668.0" y="102" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">goi A-G</text>
<text x="668.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">muc claim</text>
<text x="16" y="202" text-anchor="start" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Vi du Giai doan 1: scout 3,000 roi claim 2,200; hop nhat giu hang claim o o da gieo lai.</text>
<text x="16" y="218" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Chi do sau hat. Giai doan nao chay ban do nao o phase_roadmap.svg.</text>
