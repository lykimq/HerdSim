<text x="84.0" y="122" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">duong dan + resume</text>
<text x="157.0" y="107.0" text-anchor="middle" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
