<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Chuoi giai doan 1">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Chuỗi giai đoạn 1 (những gì đã chạy thật)</text>
<rect x="20" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#2a4a3a" stroke-width="2"/><text x="70" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#2a4a3a" font-family="Segoe UI,Noto Sans,sans-serif">1. Thử khói</text><text x="70" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">lưới 5×6</text><text x="70" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">5 hạt</text><text x="70" y="128" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">150 lần</text><rect x="140" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#6b4f2a" stroke-width="2"/><text x="190" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#6b4f2a" font-family="Segoe UI,Noto Sans,sans-serif">2. Trinh sát</text><text x="190" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">lưới 10×10</text><text x="190" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">30 hạt</text><text x="190" y="128" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">3000 lần</text><rect x="260" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#5b4a2f" stroke-width="2"/><text x="310" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">3. Chọn ô</text><text x="310" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">cửa sổ biên</text><text x="310" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">22 ô</text><rect x="380" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#1f4e79" stroke-width="2"/><text x="430" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">4. Khẳng định</text><text x="430" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">22 ô</text><text x="430" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">100 hạt</text><text x="430" y="128" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">2200 lần</text><rect x="500" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#1f4e79" stroke-width="2"/><text x="550" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">5. Phân tích</text><text x="550" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">gói A</text><text x="550" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">+ khớp F</text><rect x="620" y="44" width="100" height="110" rx="8" fill="#fff" stroke="#9b2c2c" stroke-width="2"/><text x="670" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">6. Kéo dài giờ</text><text x="670" y="92" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">0 ô</text><text x="670" y="110" text-anchor="middle" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">bỏ qua</text><text x="120" y="100" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text><text x="240" y="100" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text><text x="360" y="100" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text><text x="480" y="100" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text><text x="600" y="100" font-size="18" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text><text x="16" y="180" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Kéo dài giờ trống vì không có khởi đầu quá tải (C2a không được hỗ trợ trên bản đồ này).</text></svg>