<text x="282" y="277" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">3,089</text>
<rect x="366" y="262" width="274" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="372" y="277" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Gom 90%</text>
<text x="16" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Độ nhạy: giảm Rrep cừu 3.0 xuống 2.5 (Bảng IX)</text>
<text x="16" y="322" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Cell          Trước     Sau</text>
<text x="16" y="340" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D=6, N=400</text>
<text x="160" y="340" text-anchor="start" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">0%</text>
<text x="230" y="340" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">-&gt;</text>
<text x="260" y="340" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">92%</text>
<text x="16" y="362" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D=3, N=250</text>
<text x="160" y="362" text-anchor="start" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">5%</text>
<text x="230" y="362" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">-&gt;</text>
<text x="260" y="362" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">100%</text>
<text x="400" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Gradient mật độ so với GCM thật (RQ3; ~80 triệu qs; Bảng X)</text>
<text x="400" y="322" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- N &gt;= 100: sai góc trung bình ~18 đến 22 độ</text>
<text x="400" y="342" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Đúng sector thường &gt;= 65%; đúng hoặc kề &gt;= 87%</text>
<text x="400" y="362" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Tệ hơn ở N rất nhỏ hoặc rất lớn (thưa / giới hạn tầm nhìn)</text>
<text x="16" y="418" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Đây là phát hiện bản thảo. HerdSim không chạy lại các phân tích NetLogo này.</text>
