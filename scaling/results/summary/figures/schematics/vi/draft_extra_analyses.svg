<text x="500" y="148" text-anchor="start" font-size="11" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">rho = -0.819</text>
<text x="600" y="148" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Gần nhất nhì</text>
