<text x="16" y="146" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">S_bar * sqrt(N)</text>
<rect x="200" y="134" width="280" height="20" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="4"/>
