<text x="22" y="253" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">S_bar &lt;= 25 (còn kiểm soát)</text>
<rect x="276" y="238" width="84" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="282" y="253" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">928</text>
<rect x="366" y="238" width="274" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="372" y="253" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Gom 74%; giữ 9%; thoát 18%</text>
<rect x="16" y="262" width="254" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="277" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Mọi thất bại</text>
