<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Phân tích thêm bản thảo 2025 (Bảng VIII đến X)</text>
<text x="16" y="48" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Độ trải so với thành công (Spearman trên 110 ô)</text>
