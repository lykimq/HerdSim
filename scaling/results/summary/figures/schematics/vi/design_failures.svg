<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="371" viewBox="0 0 740 371" role="img" aria-label="nhan that bai">
<rect x="0" y="0" width="740" height="371" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Nhãn thất bại: ý nghĩa, và đường cong chỉ số nhìn ra sao</text>
<rect x="16" y="40" width="228" height="54" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="8"/>
<text x="28" y="60" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">1. chồng chất</text>
<text x="28" y="78" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">chó chồng lên một điểm</text>
<rect x="256" y="40" width="228" height="54" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="8"/>
<text x="268" y="60" text-anchor="start" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">2. tách</text>
<text x="268" y="78" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">đàn còn nhiều cụm</text>
<rect x="496" y="40" width="228" height="54" fill="#fff" stroke="#b45309" stroke-width="2" rx="8"/>
<text x="508" y="60" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">3. tán</text>
<text x="508" y="78" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">khoảng cách kết đàn cao</text>
<rect x="16" y="102" width="228" height="54" fill="#fff" stroke="#9b2c2c" stroke-width="2" rx="8"/>
<text x="28" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">4. dao động</text>
<text x="28" y="140" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">GCM đổi dấu, tiến ít</text>
<rect x="256" y="102" width="228" height="54" fill="#fff" stroke="#5b4a2f" stroke-width="2" rx="8"/>
<text x="268" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">5. kẹt</text>
<text x="268" y="140" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">GCM gần như không tiến về</text>
<text x="268" y="153" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">đích</text>
<rect x="496" y="102" width="228" height="54" fill="#fff" stroke="#5c5852" stroke-width="2" rx="8"/>
<text x="508" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">6. hết giờ</text>
<text x="508" y="140" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">chưa xong tại T0</text>
<text x="16" y="180" text-anchor="start" font-size="12" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Lượt thất bại nhìn trên đồ thị chỉ số (phác thảo)</text>
<rect x="16" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="22" y1="232" x2="100" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="22" y1="202" x2="22" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="24" y1="206" x2="44" y2="210" stroke="#2f6b45" stroke-width="2"/>
<line x1="44" y1="210" x2="66" y2="218" stroke="#2f6b45" stroke-width="2"/>
<line x1="66" y1="218" x2="86" y2="228" stroke="#2f6b45" stroke-width="2"/>
<line x1="86" y1="228" x2="100" y2="232" stroke="#2f6b45" stroke-width="2"/>
<text x="61" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">thành công</text>
<text x="61" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">gcm_goal hạ về</text>
<text x="61" y="277" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">đích</text>
<rect x="136" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="142" y1="232" x2="220" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="142" y1="202" x2="142" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="144" y1="208" x2="156" y2="224" stroke="#9b2c2c" stroke-width="2"/>
<line x1="156" y1="224" x2="168" y2="206" stroke="#9b2c2c" stroke-width="2"/>
<line x1="168" y1="206" x2="180" y2="226" stroke="#9b2c2c" stroke-width="2"/>
<line x1="180" y1="226" x2="192" y2="208" stroke="#9b2c2c" stroke-width="2"/>
<line x1="192" y1="208" x2="204" y2="224" stroke="#9b2c2c" stroke-width="2"/>
<line x1="204" y1="224" x2="220" y2="210" stroke="#9b2c2c" stroke-width="2"/>
<text x="181" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">dao động</text>
<text x="181" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">gcm_goal zigzag,</text>
<text x="181" y="277" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">vẫn cao</text>
<rect x="256" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="262" y1="232" x2="340" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="262" y1="202" x2="262" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="264" y1="210" x2="286" y2="211" stroke="#5b4a2f" stroke-width="2"/>
<line x1="286" y1="211" x2="311" y2="212" stroke="#5b4a2f" stroke-width="2"/>
<line x1="311" y1="212" x2="340" y2="213" stroke="#5b4a2f" stroke-width="2"/>
<text x="301" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#5b4a2f" font-family="Segoe UI,Noto Sans,sans-serif">kẹt</text>
<text x="301" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">gcm_goal phẳng /</text>
<text x="301" y="277" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">hạ rất ít</text>
<rect x="376" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="382" y1="232" x2="460" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="382" y1="202" x2="382" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="384" y1="208" x2="411" y2="212" stroke="#5c5852" stroke-width="2"/>
<line x1="411" y1="212" x2="436" y2="218" stroke="#5c5852" stroke-width="2"/>
<line x1="436" y1="218" x2="460" y2="222" stroke="#5c5852" stroke-width="2"/>
<text x="421" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">hết giờ</text>
<text x="421" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">gcm_goal vẫn cao</text>
<text x="421" y="277" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">tại T0</text>
<rect x="496" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="502" y1="232" x2="580" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="502" y1="202" x2="502" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="504" y1="208" x2="526" y2="207" stroke="#b45309" stroke-width="2"/>
<line x1="526" y1="207" x2="551" y2="209" stroke="#b45309" stroke-width="2"/>
<line x1="551" y1="209" x2="580" y2="208" stroke="#b45309" stroke-width="2"/>
<text x="541" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">tán</text>
<text x="541" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">cohesion giữ cao</text>
<rect x="616" y="196" width="90" height="42" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<line x1="622" y1="232" x2="700" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="622" y1="202" x2="622" y2="232" stroke="#bbb3a5" stroke-width="1"/>
<line x1="624" y1="230" x2="646" y2="229" stroke="#7b1fa2" stroke-width="2"/>
<line x1="646" y1="229" x2="671" y2="231" stroke="#7b1fa2" stroke-width="2"/>
<line x1="671" y1="231" x2="700" y2="230" stroke="#7b1fa2" stroke-width="2"/>
<text x="661" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">tách</text>
<text x="661" y="266" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">fragmentation</text>
<text x="661" y="277" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">giữ thấp</text>
<text x="16" y="295" text-anchor="start" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Có trong dữ liệu xác nhận: dao động, kẹt, hết giờ, tán, tách. Không thấy: chồng chất.</text>
<text x="16" y="318" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Nhãn là heuristic phân tích sau khi lượt thất bại (không phải lý do dừng). Nhãn khớp đầu</text>
<text x="16" y="331" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">tiên theo thứ tự ưu tiên thắng. chồng chất cần lịch sử khoảng cách chó (hiếm trong các lần</text>
<text x="16" y="344" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">chạy này).</text>
</svg>