<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-label="tin cay herdsim">
<rect x="0" y="0" width="780" height="280" fill="#f7f6f2"/>
<text x="16" y="26" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Tại sao tin kết quả HerdSim (mà không cần là NetLogo)</text>
<rect x="16" y="44" width="176" height="188" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="10"/>
<circle cx="38" cy="68" r="14" fill="#1f4e79"/>
<text x="38" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">1</text>
<text x="60" y="74" text-anchor="start" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Thuật toán công bố</text>
<text x="30" y="114" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Bộ điều khiển tái dùng ý</text>
<text x="30" y="134" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Strombom / Kubo + ghi chú fidelity</text>
<text x="30" y="162" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Không invent từ đầu</text>
<line x1="194" y1="138.0" x2="202" y2="138.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="204" y="44" width="176" height="188" fill="#fff" stroke="#2f6b45" stroke-width="2" rx="10"/>
<circle cx="226" cy="68" r="14" fill="#2f6b45"/>
<text x="226" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">2</text>
<text x="248" y="74" text-anchor="start" font-size="11" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Twin NetLogo</text>
<text x="218" y="114" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Twin máy tính cho phương pháp</text>
<text x="218" y="134" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">chung: kiểm hành vi</text>
<text x="218" y="162" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Không phát lại từng bước</text>
<line x1="382" y1="138.0" x2="390" y2="138.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="392" y="44" width="176" height="188" fill="#fff" stroke="#b45309" stroke-width="2" rx="10"/>
<circle cx="414" cy="68" r="14" fill="#b45309"/>
<text x="414" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">3</text>
<text x="436" y="74" text-anchor="start" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Giao thức đóng băng</text>
<text x="406" y="114" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">scaling_v2, hạt giống, dò/xác nhận,</text>
<text x="406" y="134" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">bootstrap, CSV mở</text>
<text x="406" y="162" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Đường kết luận tái lập được</text>
<line x1="570" y1="138.0" x2="578" y2="138.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="580" y="44" width="176" height="188" fill="#fff" stroke="#9b2c2c" stroke-width="2" rx="10"/>
<circle cx="602" cy="68" r="14" fill="#9b2c2c"/>
<text x="602" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">4</text>
<text x="624" y="74" text-anchor="start" font-size="11" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">Giới hạn nói thẳng</text>
<text x="594" y="114" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Chưa bảng parity định lượng;</text>
<text x="594" y="134" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">FAT không twin; bản thảo</text>
<text x="594" y="162" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">không phải twin</text>
<text x="16" y="266" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Tin cậy là bằng chứng xếp lớp, không phải 'cùng IDE với mọi người'. Mọi số kết luận vẫn từ CSV HerdSim.</text>
</svg>