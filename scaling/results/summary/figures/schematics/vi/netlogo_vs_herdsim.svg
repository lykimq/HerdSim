<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="474" viewBox="0 0 780 474" role="img" aria-label="netlogo nen tang vs herdsim he thong">
<rect x="0" y="0" width="780" height="474" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo như nền tảng so với HerdSim như hệ thống</text>
<rect x="16" y="40" width="340" height="190" fill="#fff" stroke="#b45309" stroke-width="2" rx="10"/>
<rect x="424" y="40" width="340" height="190" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="10"/>
<text x="186.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo (nền tảng ABM)</text>
<text x="594.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">HerdSim (chồng chăn đàn)</text>
<text x="32" y="96" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Ngôn ngữ mô phỏng đa tác nhân tổng quát</text>
<text x="32" y="120" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Thế giới ô / rùa (không gian rời rạc)</text>
<text x="32" y="144" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- IDE máy tính: setup, go, monitor</text>
<text x="32" y="168" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- BehaviorSpace cho quét hàng loạt</text>
<text x="32" y="192" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Mọi mô hình .nlogo (học + nghiên cứu)</text>
<text x="440" y="96" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Chồng chuyên cho phương pháp chăn đàn</text>
<text x="440" y="120" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Không gian liên tục, tường đàn hồi, bước rời</text>
<text x="440" y="144" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Ứng dụng Simulate / Compare / Experiments</text>
<text x="440" y="168" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Phân tầng dò đường-xác nhận, hạt giống, CSV</text>
<text x="440" y="192" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Kịch bản + chỉ số chung giữa các phương pháp</text>
<rect x="16" y="242" width="748" height="40" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="8"/>
<text x="390.0" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">&lt;-&gt;</text>
<text x="390.0" y="276" text-anchor="middle" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">liên quan, không cùng nhị phân. twin nối phương pháp dùng chung.</text>
<rect x="16" y="292" width="124" height="26" fill="#1f4e79" rx="4"/>
<text x="24" y="309" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Trục thiết kế</text>
<rect x="146" y="292" width="274" height="26" fill="#b45309" rx="4"/>
<text x="154" y="309" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo</text>
<rect x="426" y="292" width="294" height="26" fill="#1f4e79" rx="4"/>
<text x="434" y="309" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">HerdSim</text>
<rect x="16" y="318" width="124" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="333" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Mục đích</text>
<rect x="146" y="318" width="274" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="333" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Bộ công cụ ABM tổng quát</text>
<rect x="426" y="318" width="294" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="333" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Thí nghiệm chăn đàn kiểm soát</text>
<rect x="16" y="342" width="124" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="357" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Không gian</text>
<rect x="146" y="342" width="274" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="357" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Ô / rùa</text>
<rect x="426" y="342" width="294" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="357" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Vị trí liên tục</text>
<rect x="16" y="366" width="124" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="381" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Hàng loạt</text>
<rect x="146" y="366" width="274" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="381" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">BehaviorSpace / tay</text>
<rect x="426" y="366" width="294" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="381" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Experiments + đường ống xác nhận</text>
<rect x="16" y="390" width="124" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="405" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">So sánh</text>
<rect x="146" y="390" width="274" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="405" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Cửa sổ riêng</text>
<rect x="426" y="390" width="294" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="405" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Tab Compare + chỉ số chung</text>
<text x="16" y="430" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Có twin cho một số phương pháp (kiểm hành vi, không trùng bit). Bản thảo 2025 là một mô hình</text>
<text x="16" y="444" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo với nhiệm vụ riêng; không phải bản thân NetLogo.</text>
</svg>