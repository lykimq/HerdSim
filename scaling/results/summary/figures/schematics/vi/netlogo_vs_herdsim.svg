<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="netlogo nen tang vs herdsim he thong">
<rect x="0" y="0" width="780" height="420" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo như nền tảng so với HerdSim như hệ thống</text>
<rect x="16" y="40" width="340" height="190" fill="#fff" stroke="#b45309" stroke-width="2" rx="10"/>
<rect x="424" y="40" width="340" height="190" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="10"/>
<text x="186" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo (nền tảng ABM)</text>
<text x="594" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">HerdSim (chồng chăn đàn)</text>
<text x="32" y="96" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Ngôn ngữ mô phỏng đa tác nhân tổng quát</text>
<text x="32" y="120" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Thế giới ô / rùa (không gian rời rạc)</text>
<text x="32" y="144" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- IDE máy tính: setup, go, monitor</text>
<text x="32" y="168" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- BehaviorSpace cho quét hàng loạt</text>
<text x="32" y="192" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Mọi mô hình .nlogo (học + nghiên cứu)</text>
<text x="440" y="96" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Chồng chuyên cho phương pháp chăn đàn</text>
<text x="440" y="120" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Không gian liên tục, tường đàn hồi, bước rời</text>
<text x="440" y="144" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Ứng dụng Simulate / Compare / Experiments</text>
<text x="440" y="168" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Phân tầng dò đường-xác nhận, hạt giống, CSV</text>
<text x="440" y="192" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">- Kịch bản + chỉ số chung giữa các phương pháp</text>
<text x="390" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">&lt;-&gt;</text>
<text x="390" y="145" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">liên quan, không cùng nhị phân</text>
<text x="390" y="162" text-anchor="middle" font-size="9" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">twin nối phương pháp dùng chung</text>
<rect x="16" y="250" width="124" height="26" fill="#1f4e79" rx="4"/>
<text x="24" y="267" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">Trục thiết kế</text>
<rect x="146" y="250" width="274" height="26" fill="#b45309" rx="4"/>
<text x="154" y="267" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo</text>
<rect x="426" y="250" width="294" height="26" fill="#1f4e79" rx="4"/>
<text x="434" y="267" text-anchor="start" font-size="11" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">HerdSim</text>
<rect x="16" y="282" width="124" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="297" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Mục đích</text>
<rect x="146" y="282" width="274" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="297" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Bộ công cụ ABM tổng quát</text>
<rect x="426" y="282" width="294" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="297" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Thí nghiệm chăn đàn kiểm soát</text>
<rect x="16" y="306" width="124" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="321" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Không gian</text>
<rect x="146" y="306" width="274" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="321" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Ô / rùa</text>
<rect x="426" y="306" width="294" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="321" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Vị trí liên tục</text>
<rect x="16" y="330" width="124" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="345" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Hàng loạt</text>
<rect x="146" y="330" width="274" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="345" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">BehaviorSpace / tay</text>
<rect x="426" y="330" width="294" height="22" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="345" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Experiments + đường ống xác nhận</text>
<rect x="16" y="354" width="124" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="22" y="369" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">So sánh</text>
<rect x="146" y="354" width="274" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="152" y="369" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Cửa sổ riêng</text>
<rect x="426" y="354" width="294" height="22" fill="#efece5" stroke="#bbb3a5" stroke-width="1" rx="3"/>
<text x="432" y="369" text-anchor="start" font-size="10" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Tab Compare + chỉ số chung</text>
<text x="16" y="406" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Có twin cho một số phương pháp (kiểm hành vi, không trùng bit). Bản thảo 2025 là một mô hình NetLogo với nhiệm vụ riêng; không phải bản thân NetLogo.</text>
</svg>