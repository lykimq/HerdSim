<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="tom tat ket qua">
<rect width="780" height="420" fill="#f7f6f2"/>
<text x="16" y="28" font-size="15" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Kết quả nhìn một phát (Giai đoạn 1, 2, 4 mức xác nhận)</text>
<rect x="16" y="48" width="240" height="150" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="2"/>
<text x="30" y="74" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">D_min cơ sở</text>
<text x="30" y="116" font-size="34" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">1</text>
<text x="30" y="142" font-size="13" font-weight="600" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">chó với N = 25 đến 400</text>
<text x="30" y="166" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">N = 5 và 10 cần 2 (R 0.07 / 0.24</text>
<text x="30" y="182" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">tại D=1)</text>
<rect x="270" y="48" width="240" height="150" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="284" y="74" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Thêm chó</text>
<text x="284" y="116" font-size="34" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">88%</text>
<text x="284" y="142" font-size="13" font-weight="600" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">ô lãng phí</text>
<text x="284" y="166" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Thời gian ~183 bước phẳng; ~146</text>
<text x="284" y="182" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">đường / chó</text>
<rect x="524" y="48" width="240" height="150" rx="10" fill="#fff" stroke="#9b2c2c" stroke-width="2"/>
<text x="538" y="74" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">D_min(N) bản thảo</text>
<text x="538" y="116" font-size="34" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Không</text>
<text x="538" y="142" font-size="13" font-weight="600" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">đường dốc ở đây</text>
<text x="538" y="166" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Bản thảo 20 đến 35 chó khi N&gt;=200;</text>
<text x="538" y="182" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">ở đây 1 chó</text>
<rect x="140" y="220" width="240" height="150" rx="10" fill="#fff" stroke="#7b1fa2" stroke-width="2"/>
<text x="154" y="246" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">Cấu trúc xuất phát</text>
<text x="154" y="288" font-size="34" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Chi phí</text>
<text x="154" y="314" font-size="13" font-weight="600" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">không phải D_min</text>
<text x="154" y="338" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Phân tán 11x đến 36x chi phí;</text>
<text x="154" y="354" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min vẫn 1</text>
<rect x="400" y="220" width="240" height="150" rx="10" fill="#fff" stroke="#2f6b45" stroke-width="2"/>
<text x="414" y="246" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Bộ điều khiển khác</text>
<text x="414" y="288" font-size="34" font-weight="800" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Lẫn</text>
<text x="414" y="314" font-size="13" font-weight="600" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">chuyển giao</text>
<text x="414" y="338" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Kubo ổn tập trung, fail phân tán;</text>
<text x="414" y="354" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">FAT chỉ N&lt;=10</text>
<text x="16" y="402" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Trần: R = 1.00 tại D = 1 gần như mọi ô cơ sở, nên độ khó tỷ lệ còn khó đo.</text>
</svg>