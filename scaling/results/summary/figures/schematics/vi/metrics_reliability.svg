<text x="50" y="160" text-anchor="start" font-size="11" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">thành công</text>
<text x="400" y="160" text-anchor="start" font-size="11" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">thất bại / hết giờ</text>
<text x="36" y="190" text-anchor="start" font-size="13" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">R = 7/10 = 0.70</text>
<text x="220" y="190" text-anchor="start" font-size="12" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">theta = 0.90 (ngưỡng xác nhận)</text>
<text x="36" y="214" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min cần R &gt;= theta. R = 1.00 nghĩa là mọi mẫu thành công.</text>
