<text x="98" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">2</text>
<circle cx="146" cy="120" r="14" fill="#2f6b45"/>
<text x="146" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">3</text>
<circle cx="194" cy="120" r="14" fill="#2f6b45"/>
<text x="194" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">4</text>
<circle cx="242" cy="120" r="14" fill="#2f6b45"/>
<text x="242" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">5</text>
<circle cx="290" cy="120" r="14" fill="#2f6b45"/>
<text x="290" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">6</text>
<circle cx="338" cy="120" r="14" fill="#2f6b45"/>
<text x="338" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">7</text>
<circle cx="386" cy="120" r="14" fill="#9b2c2c"/>
<text x="386" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">8</text>
<circle cx="434" cy="120" r="14" fill="#9b2c2c"/>
