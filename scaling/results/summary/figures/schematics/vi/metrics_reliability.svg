<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="do tin cay tren mau">
<rect x="0" y="0" width="720" height="260" fill="#f7f6f2"/>
<text x="16" y="26" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Độ tin cậy R: tỉ lệ mẫu hoàn thành trước T0</text>
<rect x="16" y="44" width="688" height="196" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="8"/>
<text x="36" y="72" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Một ô (N, D, bố cục, phương pháp)</text>
<circle cx="50" cy="120" r="14" fill="#2f6b45"/>
