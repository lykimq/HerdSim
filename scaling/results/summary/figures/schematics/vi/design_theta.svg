<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="nguong theta">
<rect x="0" y="0" width="720" height="180" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Thiết kế: theta = 0.90 quyết định D_min</text>
<text x="16" y="44" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">0.50 và 0.70 được báo cáo để chẩn đoán, không dùng cho biên kết luận</text>
<rect x="60" y="80" width="540" height="28" fill="#fecaca" rx="6"/>
<rect x="546.0" y="80" width="54.0" height="28" fill="#bbf7d0"/>
<rect x="60" y="80" width="540" height="28" fill="none" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<line x1="546.0" y1="70" x2="546.0" y2="120" stroke="#2f6b45" stroke-width="2"/>
<text x="546.0" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">0.90</text>
<text x="303.0" y="100" text-anchor="middle" font-size="12" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">dải thất bại</text>
<text x="573.0" y="100" text-anchor="middle" font-size="11" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">dải đạt</text>
<text x="60" y="140" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">0</text>
<text x="600" y="140" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">1</text>
<text x="16" y="168" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Cùng dải tin cậy với bản thảo 2025.</text>
