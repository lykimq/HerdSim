<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Regimes">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Regimes along D at fixed N (conceptual)</text>
  <!-- axes -->
  <line x1="70" y1="240" x2="600" y2="240" stroke="#5c5852"/>
  <line x1="70" y1="240" x2="70" y2="50" stroke="#5c5852"/>
  <text x="335" y="270" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D (dogs) →</text>
  <text x="24" y="150" text-anchor="middle" font-size="12" fill="#5c5852" transform="rotate(-90 24 150)" font-family="Segoe UI,Noto Sans,sans-serif">R</text>
  <text x="60" y="55" text-anchor="end" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">1.0</text>
  <text x="60" y="100" text-anchor="end" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">0.9</text>
  <line x1="70" y1="100" x2="600" y2="100" stroke="#1f4e79" stroke-dasharray="4 3"/>
  <text x="605" y="104" font-size="10" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">theta</text>
  <!-- curve: low R, jump to high, stay high (no overcrowding collapse) -->
  <path d="M90,220 C130,210 150,200 170,110 C190,70 220,60 280,55 C400,50 520,52 580,55"
        fill="none" stroke="#2f6b45" stroke-width="3"/>
  <!-- bands -->
  <rect x="80" y="50" width="70" height="190" fill="#9b2c2c" opacity="0.12"/>
  <rect x="150" y="50" width="80" height="190" fill="#2f6b45" opacity="0.12"/>
  <rect x="230" y="50" width="350" height="190" fill="#1f4e79" opacity="0.08"/>
  <text x="115" y="290" text-anchor="middle" font-size="11" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">under</text>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">efficient</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">wasteful (still succeeds)</text>
  <text x="16" y="42" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Phase 1: R rises to the bar and stays up. No overcrowding collapse at high D on compact Strombom.</text>
</svg>