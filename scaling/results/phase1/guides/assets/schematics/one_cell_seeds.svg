<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Mot o">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Một ô = một cặp (số cừu, số chó), lặp lại bằng nhiều hạt giống</text>
  <rect x="20" y="44" width="200" height="160" rx="8" fill="#fff" stroke="#ddd8ce"/>
  <text x="120" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Ví dụ một ô</text>
  <text x="120" y="92" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">100 cừu</text>
  <text x="120" y="114" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">1 chó</text>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">bố cục = gọn</text>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">phương pháp = Strombom</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">hết giờ = 10.000 bước</text>
  <text x="240" y="120" font-size="22" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">→</text>
  <rect x="270" y="44" width="340" height="160" rx="8" fill="#fff" stroke="#ddd8ce"/>
  <text x="440" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">30 hạt trinh sát (thắng / thua)</text>
<circle cx="300" cy="92" r="9" fill="#2f6b45"/><circle cx="328" cy="92" r="9" fill="#2f6b45"/><circle cx="356" cy="92" r="9" fill="#2f6b45"/><circle cx="384" cy="92" r="9" fill="#9b2c2c"/><circle cx="412" cy="92" r="9" fill="#2f6b45"/><circle cx="440" cy="92" r="9" fill="#2f6b45"/><circle cx="468" cy="92" r="9" fill="#2f6b45"/><circle cx="496" cy="92" r="9" fill="#2f6b45"/><circle cx="524" cy="92" r="9" fill="#9b2c2c"/><circle cx="552" cy="92" r="9" fill="#2f6b45"/><circle cx="300" cy="120" r="9" fill="#2f6b45"/><circle cx="328" cy="120" r="9" fill="#2f6b45"/><circle cx="356" cy="120" r="9" fill="#2f6b45"/><circle cx="384" cy="120" r="9" fill="#2f6b45"/><circle cx="412" cy="120" r="9" fill="#2f6b45"/><circle cx="440" cy="120" r="9" fill="#2f6b45"/><circle cx="468" cy="120" r="9" fill="#2f6b45"/><circle cx="496" cy="120" r="9" fill="#2f6b45"/><circle cx="524" cy="120" r="9" fill="#2f6b45"/><circle cx="552" cy="120" r="9" fill="#2f6b45"/><circle cx="300" cy="148" r="9" fill="#2f6b45"/><circle cx="328" cy="148" r="9" fill="#2f6b45"/><circle cx="356" cy="148" r="9" fill="#2f6b45"/><circle cx="384" cy="148" r="9" fill="#2f6b45"/><circle cx="412" cy="148" r="9" fill="#9b2c2c"/><circle cx="440" cy="148" r="9" fill="#2f6b45"/><circle cx="468" cy="148" r="9" fill="#2f6b45"/><circle cx="496" cy="148" r="9" fill="#2f6b45"/><circle cx="524" cy="148" r="9" fill="#2f6b45"/><circle cx="552" cy="148" r="9" fill="#2f6b45"/>
  <text x="440" y="188" text-anchor="middle" font-size="13" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">R = 27/30 = 0,90  (đạt ngưỡng)</text>
  <text x="16" y="240" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Xanh = thắng (mọi cừu vào đích). Đỏ = thua (hết giờ).</text>
  <text x="16" y="262" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Trinh sát: 30 hạt/ô. Khẳng định: 100 hạt. Hình hạt minh họa ý tưởng, không phải một ô thật duy nhất.</text>
</svg>