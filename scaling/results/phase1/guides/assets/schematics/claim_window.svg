<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Cua so bien">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Cửa sổ khẳng định: chỉ gieo lại quanh số chó tối thiểu (ví dụ 5 cừu)</text>
  <text x="16" y="44" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Trinh sát thấy số chó tối thiểu = 2. Cửa sổ = trước, biên, sau = {1, 2, 3}. Các ô đó nhận 100 hạt. Mức khác giữ 30.</text>
<rect x="40" y="90" width="48" height="70" rx="6" fill="#1f4e79" stroke="#bbb3a5" stroke-width="1"/><text x="64" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">1</text><rect x="98" y="90" width="48" height="70" rx="6" fill="#1f4e79" stroke="#0d2f4d" stroke-width="2.5"/><text x="122" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">2</text><text x="122" y="175" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">biên</text><rect x="156" y="90" width="48" height="70" rx="6" fill="#1f4e79" stroke="#bbb3a5" stroke-width="1"/><text x="180" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">3</text><rect x="214" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="238" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">4</text><rect x="272" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="296" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">6</text><rect x="330" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="354" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">10</text><rect x="388" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="412" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">15</text><rect x="446" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="470" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">20</text><rect x="504" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="528" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">25</text><rect x="562" y="90" width="48" height="70" rx="6" fill="#ddd8ce" stroke="#bbb3a5" stroke-width="1"/><text x="586" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">35</text>
  <rect x="40" y="200" width="18" height="18" rx="3" fill="#1f4e79"/>
  <text x="66" y="213" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">gieo lại khẳng định (100 hạt)</text>
  <rect x="300" y="200" width="18" height="18" rx="3" fill="#ddd8ce"/>
  <text x="326" y="213" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">chỉ trinh sát (30 hạt, giữ trong bản gộp)</text>
  <text x="16" y="248" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Giai đoạn 1 chọn 22 ô như vậy trên mọi mức số cừu (không có cửa sổ quá tải).</text>
</svg>