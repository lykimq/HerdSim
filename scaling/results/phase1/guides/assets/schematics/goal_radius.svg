<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Ban kinh dich">
  <rect width="100%" height="100%" fill="#f7f6f2"/>
  <text x="16" y="24" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Bán kính đích = 15 · sqrt(N/50) (diện tích theo cừu giữ tương đương)</text>
<circle cx="80" cy="130" r="33.0" fill="#cfe0f0" stroke="#1f4e79" stroke-width="1.5"/><text x="80" y="134" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">r=15.0</text><text x="80" y="210" text-anchor="middle" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">50 cừu</text><circle cx="220" cy="130" r="46.7" fill="#cfe0f0" stroke="#1f4e79" stroke-width="1.5"/><text x="220" y="134" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">r=21.2</text><text x="220" y="210" text-anchor="middle" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">100 cừu</text><circle cx="360" cy="130" r="66.0" fill="#cfe0f0" stroke="#1f4e79" stroke-width="1.5"/><text x="360" y="134" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">r=30.0</text><text x="360" y="210" text-anchor="middle" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">200 cừu</text><circle cx="500" cy="130" r="93.3" fill="#cfe0f0" stroke="#1f4e79" stroke-width="1.5"/><text x="500" y="134" text-anchor="middle" font-size="11" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">r=42.4</text><text x="500" y="210" text-anchor="middle" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">400 cừu</text><text x="16" y="48" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Bán kính cố định sẽ kẹt đàn lớn. Tăng theo căn bậc hai giữ độ chật công bằng giữa các kích thước.</text></svg>