# Phase-1 claim-grade boundary reseed (RQ2 / Package A).
# Grade: CLAIM. Do not run until a scout map exists under phase1/scout/.
#
# Why this protocol: Section 8 D_min procedure. Scout (30 seeds) maps R(N,D);
# this campaign reseeds only boundary cells at claim_grade_seeds (100) and
# writes bootstrap CIs. Use:
#   make -C scaling scaling-claim-plan SCOUT_TRIALS=results/phase1/scout/trials.csv
#   make -C scaling scaling-claim-reseed SCOUT_TRIALS=... WORKERS=...
# Do not cite SMOKE/SCOUT runs for C2a/C2b.

protocol_id: phase1_claim
phase: 1
grade: CLAIM
output: scaling/results/phase1/claim
canonical: scaling/configs/canonical_grid.yaml

methods:
  - strombom_multi
  # Baseline only until Package A frontiers exist for transfer (RQ4).
layouts:
  - compact
  # Hold structure fixed; RQ1 varies X0 after size frontiers are claim-grade.
flock_sizes: [5, 10, 25, 50, 75, 100, 150, 200, 300, 400]
# Full freeze N ladder; actual claim jobs are filtered to scout boundary cells.
shepherd_counts: [1, 2, 3, 4, 6, 10, 15, 20, 25, 35]
# Full freeze D; plan_claim_cells.py keeps only enter/exit boundary D per N.
seeds: 100
# claim_grade_seeds from canonical; explicit here so the YAML is self-describing.
seed_mode: claim
store_timeseries: true
# Needed for later RQ3/RQ7 on contrast cells.
packages: [A, F]
# A = claim frontiers + bootstrap; F = scaling fits once D_min is not flat.
