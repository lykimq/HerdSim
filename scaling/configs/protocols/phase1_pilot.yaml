# Phase-1 smoke pilot (compact layout, reduced grid).
# Grade: SMOKE. Not claim-grade.
#
# Why this subset: prove the pipeline (run -> trials -> Package A -> figures)
# in minutes, not hours. Uses protocol defaults from canonical_grid.yaml unless
# overridden below. Any new protocol YAML must document why each override exists.

protocol_id: phase1_pilot
# Matches results folder slug phase1/pilot and provenance protocol_id.
phase: 1
# Package A / RQ2 path (herdability maps).
grade: SMOKE
# Pipeline check only; do not cite for C2/C6.
output: scaling/results/phase1/pilot
# Canonical layout: phase{k}/{protocol_slug}/.
canonical: scaling/configs/canonical_grid.yaml
# Inherits frozen Section 8 defaults; fields below are intentional subsets.

methods:
  - strombom_multi
  # Baseline only: smoke does not need RQ4 transfer cost.
layouts:
  - compact
  # Easiest X0: if compact is already hard, the pipeline or params are wrong.
flock_sizes: [5, 10, 25, 50, 100]
# Same floor as canonical_grid.yaml (N starts at 5, then 10). Keeps a reduced
# smoke ladder through small-mid / mid / near-breakpoint without the full
# freeze cost (omits 75 and 150..400).
shepherd_counts: [1, 2, 3, 4, 6, 10]
# Low-D focus where D_min usually lives; omits 15..35 overcrowding probe for speed.
seeds: 5
# Minimal repeats to exercise multi-seed aggregation; not for CI.
seed_mode: scout
store_timeseries: true
# Needed to validate Parquet I14 path even on smoke runs.
packages: [A]
# Package A is the Phase-1 evidence export (frontier + regimes + figures).
