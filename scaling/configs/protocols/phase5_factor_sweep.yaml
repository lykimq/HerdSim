# Phase-5 information scout (RQ5).
# Grade: SCOUT. Observation ladder on the baseline method.
#
# Claim sizes are {100, 200}: the size edge and the steep band. N=50 is omitted
# because a D_min of 1 cannot fall by a grid step. Seeds are the scout depth
# (30). Range and communication ladders are separate campaigns; range steps are
# 0.5, 1, 1.5, 2 times r_s (65 for Strombom), not a base of 50.

protocol_id: phase5_factor_sweep
phase: 5
grade: SCOUT
output: scaling/results/phase5/factor_sweep
canonical: scaling/configs/canonical_grid.yaml

method: strombom_multi
layouts:
  - compact
flock_sizes: [100, 200]
shepherd_counts: [1, 2, 3, 4, 6, 10]
# Low-D band, where a one-step saving can appear. High D stays on the size map.
seeds: 30
seed_mode: scout
obs_modes:
  - bearing_only
  - local_positions
  - global
# sensing_ranges: [32.5, 65.0, 97.5, 130.0]  # 0.5x, 1x, 1.5x, 2x of r_s 65
# communications: [none, neighbour_broadcast, global_shared]
store_timeseries: false
packages: [E]
