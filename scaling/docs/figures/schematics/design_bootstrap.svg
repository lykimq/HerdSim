<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980" role="img" aria-label="Bootstrap analysis on D_min">
<rect width="960" height="980" fill="#f7f6f2"/>
<text x="20" y="28" text-anchor="start" font-size="16" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Bootstrap on D_min: how uncertain is the smallest reliable dog count?</text>
<text x="20" y="48" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Purpose: put a 95% interval on D_min using locked claim/scout seeds. Not 1,000 new simulations.</text>
<text x="20" y="66" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Worked example in the panels: Kubo outlier_rich, N=200 (point D_min=20, interval [2, 20]).</text>
<rect x="20" y="84" width="920" height="150" fill="#e8f2eb" stroke="#2f6b45" stroke-width="2" rx="8"/>
<text x="36" y="108" text-anchor="start" font-size="14" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">1. Start from locked seeds (already run)</text>
<text x="36" y="130" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">For each dog count D near the frontier, we already have a bag of trials (success or fail). Example: one cell with 100 seeds.</text>
<circle cx="36" cy="146" r="5" fill="#2f6b45"/>
<circle cx="54" cy="146" r="5" fill="#9b2c2c"/>
<circle cx="72" cy="146" r="5" fill="#2f6b45"/>
<circle cx="90" cy="146" r="5" fill="#2f6b45"/>
<circle cx="108" cy="146" r="5" fill="#9b2c2c"/>
<circle cx="126" cy="146" r="5" fill="#2f6b45"/>
<circle cx="144" cy="146" r="5" fill="#2f6b45"/>
<circle cx="162" cy="146" r="5" fill="#2f6b45"/>
<circle cx="180" cy="146" r="5" fill="#9b2c2c"/>
<circle cx="198" cy="146" r="5" fill="#2f6b45"/>
<circle cx="36" cy="162" r="5" fill="#2f6b45"/>
<circle cx="54" cy="162" r="5" fill="#2f6b45"/>
<circle cx="72" cy="162" r="5" fill="#9b2c2c"/>
<circle cx="90" cy="162" r="5" fill="#2f6b45"/>
<circle cx="108" cy="162" r="5" fill="#2f6b45"/>
<circle cx="126" cy="162" r="5" fill="#2f6b45"/>
<circle cx="144" cy="162" r="5" fill="#9b2c2c"/>
<circle cx="162" cy="162" r="5" fill="#2f6b45"/>
<circle cx="180" cy="162" r="5" fill="#2f6b45"/>
<circle cx="198" cy="162" r="5" fill="#2f6b45"/>
<circle cx="36" cy="178" r="5" fill="#2f6b45"/>
<circle cx="54" cy="178" r="5" fill="#9b2c2c"/>
<circle cx="72" cy="178" r="5" fill="#2f6b45"/>
<circle cx="90" cy="178" r="5" fill="#2f6b45"/>
<circle cx="108" cy="178" r="5" fill="#2f6b45"/>
<circle cx="126" cy="178" r="5" fill="#2f6b45"/>
<circle cx="144" cy="178" r="5" fill="#2f6b45"/>
<circle cx="162" cy="178" r="5" fill="#9b2c2c"/>
<circle cx="180" cy="178" r="5" fill="#2f6b45"/>
<circle cx="198" cy="178" r="5" fill="#2f6b45"/>
<circle cx="620" cy="162" r="5" fill="#2f6b45"/>
<text x="632" y="166" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">S = success</text>
<circle cx="620" cy="184" r="5" fill="#9b2c2c"/>
<text x="632" y="188" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">F = fail</text>
<text x="36" y="214" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">No new simulations here. Bootstrap only reshuffles these locked outcomes.</text>
<rect x="20" y="250" width="920" height="145" fill="#f3e8f8" stroke="#7b1fa2" stroke-width="2" rx="8"/>
<text x="36" y="274" text-anchor="start" font-size="14" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">2. Draw 1,000 resamples with replacement</text>
<text x="36" y="296" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Each resample picks 100 outcomes from the same bag (some seeds may repeat). Do this 1,000 times.</text>
<rect x="36" y="308" width="200" height="54" fill="#fff" stroke="#7b1fa2" stroke-width="1.5" rx="6"/>
<text x="48" y="328" text-anchor="start" font-size="11" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">Resample #1</text>
<circle cx="56" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="76" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="96" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="116" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="136" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="156" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="176" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="196" cy="346" r="4.5" fill="#2f6b45"/>
<rect x="256" y="308" width="200" height="54" fill="#fff" stroke="#7b1fa2" stroke-width="1.5" rx="6"/>
<text x="268" y="328" text-anchor="start" font-size="11" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">Resample #2</text>
<circle cx="276" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="296" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="316" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="336" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="356" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="376" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="396" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="416" cy="346" r="4.5" fill="#2f6b45"/>
<rect x="476" y="308" width="200" height="54" fill="#fff" stroke="#7b1fa2" stroke-width="1.5" rx="6"/>
<text x="488" y="328" text-anchor="start" font-size="11" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">Resample #1000</text>
<circle cx="496" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="516" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="536" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="556" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="576" cy="346" r="4.5" fill="#9b2c2c"/>
<circle cx="596" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="616" cy="346" r="4.5" fill="#2f6b45"/>
<circle cx="636" cy="346" r="4.5" fill="#9b2c2c"/>
<text x="700" y="340" text-anchor="start" font-size="13" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">... x 1,000</text>
<text x="36" y="380" text-anchor="start" font-size="12" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Still no new sims: only redraws of the locked bag.</text>
<rect x="20" y="410" width="440" height="160" fill="#e8f1f8" stroke="#1f4e79" stroke-width="2" rx="8"/>
<text x="36" y="434" text-anchor="start" font-size="14" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">3. Recompute D_min on each resample</text>
<text x="36" y="458" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">For resample k, rebuild R(D) from the redrawn</text>
<text x="36" y="476" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">seeds, then find the smallest D with R &gt;= 0.90.</text>
<text x="36" y="502" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Examples of D_min*:</text>
<text x="36" y="524" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">20,  4,  20,  2,  20,  15,  ...  (1,000 values)</text>
<text x="36" y="550" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">If a resample never clears 0.90, it stays above the grid (right-censored).</text>
<rect x="480" y="410" width="460" height="160" fill="#fef3e7" stroke="#b45309" stroke-width="2" rx="8"/>
<text x="496" y="434" text-anchor="start" font-size="14" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">4. Read the 95% interval</text>
<text x="496" y="456" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Sort the 1,000 D_min* values. Take the 2.5%</text>
<text x="496" y="474" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">and 97.5% percentiles as the interval.</text>
<rect x="510" y="500" width="34" height="40" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="527" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">2</text>
<rect x="558" y="470" width="34" height="70" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="575" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">4</text>
<rect x="606" y="505" width="34" height="35" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="623" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">6</text>
<rect x="654" y="515" width="34" height="25" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="671" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">10</text>
<rect x="702" y="495" width="34" height="45" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="719" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">15</text>
<rect x="750" y="450" width="34" height="90" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="767" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">20</text>
<rect x="798" y="520" width="34" height="20" fill="#fdba74" stroke="#b45309" stroke-width="1" rx="2"/>
<text x="815" y="554" text-anchor="middle" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">25</text>
<line x1="510" y1="568" x2="800" y2="568" stroke="#b45309" stroke-width="2"/>
<text x="655" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Bootstrap interval [2, 20]</text>
<text x="820" y="510" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Point</text>
<text x="820" y="526" text-anchor="start" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">D_min=20</text>
<rect x="20" y="590" width="920" height="175" fill="#fff" stroke="#bbb3a5" stroke-width="2" rx="8"/>
<text x="36" y="614" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">5. What we do with the interval</text>
<rect x="36" y="630" width="280" height="110" fill="#e8f2eb" stroke="#2f6b45" stroke-width="1.5" rx="6"/>
<text x="48" y="654" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Narrow / width zero</text>
<text x="48" y="676" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Every resample agrees, or the</text>
<text x="48" y="694" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">interval spans at most one D step.</text>
<text x="48" y="716" text-anchor="start" font-size="11" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Keep the claim. Report the interval.</text>
<rect x="340" y="630" width="280" height="110" fill="#fef3e7" stroke="#b45309" stroke-width="1.5" rx="6"/>
<text x="352" y="654" text-anchor="start" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Wide interval</text>
<text x="352" y="676" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Spans more than one D-grid step</text>
<text x="352" y="694" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">(example [2, 20]).</text>
<text x="352" y="716" text-anchor="start" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Raise that window to 200 real seeds,</text>
<text x="352" y="734" text-anchor="start" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">then bootstrap again.</text>
<rect x="644" y="630" width="280" height="110" fill="#e8f1f8" stroke="#1f4e79" stroke-width="1.5" rx="6"/>
<text x="656" y="654" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">After raising seeds</text>
<text x="656" y="676" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Kubo outlier_rich N=200:</text>
<text x="656" y="694" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">point D_min still 20,</text>
<text x="656" y="712" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">interval still [2, 20].</text>
<text x="656" y="734" text-anchor="start" font-size="10" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Soft edge: more seeds help, need not pin a cliff.</text>
<text x="20" y="790" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Why this matters</text>
<text x="20" y="812" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">D_min is estimated from finite seeds. Bootstrap answers: if we had redrawn those same trials, how much would D_min jump?</text>
<text x="20" y="832" text-anchor="start" font-size="12" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">A width-zero interval (common on the baseline size map) means the frontier is stable. A wide interval flags a soft edge that needs deeper claim seeds.</text>
<text x="20" y="860" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Remember: bootstrap reshuffles locked seeds. Raising to 200 seeds is the only step that runs new simulations.</text>
<text x="20" y="890" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Source idea: HerdSim bootstrap analysis board (Screenshots). Numbers: Kubo structure claim, outlier_rich N=200.</text>
</svg>
