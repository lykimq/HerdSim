<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" role="img" aria-label="RQ6 fits toy">
<rect x="0" y="0" width="720" height="325" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Toy: curve fits on D_min(N) (RQ6)</text>
<text x="16" y="44" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">After frontiers exist, compare simple curves on held-out N.</text>
<rect x="60" y="60" width="520" height="220" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="0"/>
<line x1="90" y1="250" x2="540" y2="250" stroke="#5c5852" stroke-width="1"/>
<line x1="90" y1="250" x2="90" y2="80" stroke="#5c5852" stroke-width="1"/>
<text x="315" y="275" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">N</text>
<text x="70" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min</text>
<polyline points="120,200 210,200 210,140 480,140" fill="none" stroke="#2f6b45" stroke-width="2.5"/>
<polyline points="120,210 180,185 240,165 300,155 360,148 420,144 480,142" fill="none" stroke="#b45309" stroke-width="2.5"/>
<circle cx="120" cy="200" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="180" cy="200" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="240" cy="140" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="300" cy="140" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="360" cy="140" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="420" cy="140" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<circle cx="480" cy="140" r="5" fill="#1f4e79" stroke="#fff" stroke-width="1.5"/>
<text x="560" y="145" text-anchor="start" font-size="11" font-weight="400" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">step / piecewise</text>
<text x="560" y="175" text-anchor="start" font-size="11" font-weight="400" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">smooth power</text>
<text x="16" y="308" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Toy only: real fits use claim-grade frontiers; held-out N decides the winner.</text>
</svg>