<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="284" viewBox="0 0 780 284" role="img" aria-label="trust herdsim">
<rect x="0" y="0" width="780" height="284" fill="#f7f6f2"/>
<text x="16" y="26" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Why HerdSim results can be trusted (without being NetLogo)</text>
<rect x="16" y="44" width="176" height="180" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="10"/>
<circle cx="38" cy="68" r="14" fill="#1f4e79"/>
<text x="38" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">1</text>
<text x="60" y="66" text-anchor="start" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">Published</text>
<text x="60" y="79" text-anchor="start" font-size="11" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">lineage</text>
<text x="28" y="98" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Controllers reuse</text>
<text x="28" y="112" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Strombom / Kubo ideas</text>
<text x="28" y="126" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">with fidelity notes.</text>
<text x="28" y="152" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Built on published</text>
<text x="28" y="166" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">methods</text>
<line x1="194" y1="134.0" x2="202" y2="134.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="204" y="44" width="176" height="180" fill="#fff" stroke="#2f6b45" stroke-width="2" rx="10"/>
<circle cx="226" cy="68" r="14" fill="#2f6b45"/>
<text x="226" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">2</text>
<text x="248" y="66" text-anchor="start" font-size="11" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">NetLogo twins</text>
<text x="216" y="98" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Desktop twins for</text>
<text x="216" y="112" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">shared methods:</text>
<text x="216" y="126" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">behaviour check.</text>
<text x="216" y="152" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Not a tick-for-tick</text>
<text x="216" y="166" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">replay</text>
<line x1="382" y1="134.0" x2="390" y2="134.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="392" y="44" width="176" height="180" fill="#fff" stroke="#b45309" stroke-width="2" rx="10"/>
<circle cx="414" cy="68" r="14" fill="#b45309"/>
<text x="414" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">3</text>
<text x="436" y="66" text-anchor="start" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">Frozen protocol</text>
<text x="404" y="98" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">scaling_v2, seeds,</text>
<text x="404" y="112" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">scout/claim,</text>
<text x="404" y="126" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">bootstrap, open claim</text>
<text x="404" y="140" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">CSVs.</text>
<text x="404" y="166" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Same path can be</text>
<text x="404" y="180" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">re-run</text>
<line x1="570" y1="134.0" x2="578" y2="134.0" stroke="#bbb3a5" stroke-width="2"/>
<rect x="580" y="44" width="176" height="180" fill="#fff" stroke="#9b2c2c" stroke-width="2" rx="10"/>
<circle cx="602" cy="68" r="14" fill="#9b2c2c"/>
<text x="602" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Segoe UI,Noto Sans,sans-serif">4</text>
<text x="624" y="66" text-anchor="start" font-size="11" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">Clear limits</text>
<text x="592" y="98" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">No quantitative twin</text>
<text x="592" y="112" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">parity table yet; FAT</text>
<text x="592" y="126" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">has no twin; draft</text>
<text x="592" y="140" text-anchor="start" font-size="11" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">model is not a twin.</text>
<text x="592" y="166" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">We say what we do not</text>
<text x="592" y="180" text-anchor="start" font-size="11" font-weight="700" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">claim</text>
<text x="16" y="242" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Trust comes from stacked checks, not from sharing an IDE. Every claim number still traces to</text>
<text x="16" y="256" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">HerdSim CSVs.</text>
</svg>