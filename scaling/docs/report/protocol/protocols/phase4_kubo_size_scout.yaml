# Phase-4 size scout for kubo (RQ4). Same freeze as Phase-1 size map.

extends: phase1_scout.yaml
protocol_id: phase4_kubo_size_scout
phase: 4
output: scaling/results/phase4/kubo_size/scout
methods:
