<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="shepherd interference index">
<rect x="0" y="0" width="760" height="280" fill="#f7f6f2"/>
<text x="16" y="26" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">I_dir: dog heading alignment versus conflict</text>
<text x="16" y="48" text-anchor="start" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">I_dir = 1 - ||sum u_i|| / M_active</text>
<rect x="16" y="64" width="350" height="150" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="8"/>
<text x="34" y="90" text-anchor="start" font-size="12" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">Aligned (I_dir = 0)</text>
<circle cx="80" cy="140" r="8" fill="#1f4e79"/>
<circle cx="140" cy="140" r="8" fill="#1f4e79"/>
<circle cx="200" cy="140" r="8" fill="#1f4e79"/>
<line x1="88" y1="140" x2="118" y2="140" stroke="#2f6b45" stroke-width="2.5"/>
<line x1="148" y1="140" x2="178" y2="140" stroke="#2f6b45" stroke-width="2.5"/>
<line x1="208" y1="140" x2="238" y2="140" stroke="#2f6b45" stroke-width="2.5"/>
<polygon points="238,140 228,134 228,146" fill="#2f6b45"/>
<polygon points="178,140 168,134 168,146" fill="#2f6b45"/>
<polygon points="118,140 108,134 108,146" fill="#2f6b45"/>
<text x="34" y="195" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">||sum u|| / M = 1</text>
<rect x="386" y="64" width="358" height="150" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="8"/>
<text x="404" y="90" text-anchor="start" font-size="12" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">Conflict (I_dir near 1)</text>
<circle cx="460" cy="140" r="8" fill="#1f4e79"/>
<circle cx="540" cy="120" r="8" fill="#1f4e79"/>
<circle cx="540" cy="160" r="8" fill="#1f4e79"/>
<line x1="468" y1="140" x2="510" y2="140" stroke="#9b2c2c" stroke-width="2.5"/>
<line x1="540" y1="112" x2="540" y2="90" stroke="#9b2c2c" stroke-width="2.5"/>
<line x1="540" y1="168" x2="540" y2="190" stroke="#9b2c2c" stroke-width="2.5"/>
<polygon points="510,140 500,134 500,146" fill="#9b2c2c"/>
<polygon points="540,90 534,100 546,100" fill="#9b2c2c"/>
<polygon points="540,190 534,180 546,180" fill="#9b2c2c"/>
<text x="404" y="195" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">||sum u|| / M ~ 0</text>
<text x="16" y="236" text-anchor="start" font-size="11" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">u_i = unit velocity of each moving dog (speed &gt; 1e-6). Reports use trial-mean mean_i_dir.</text>
</svg>