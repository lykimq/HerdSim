<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Toy: start structure at fixed N (RQ1)</text>
<text x="16" y="44" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Same N; only the starting shape changes. Ask whether D_min (or cost) moves.</text>
<rect x="80" y="70" width="120" height="140" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
