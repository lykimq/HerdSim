<circle cx="132" cy="141" r="4" fill="#2f6b45"/>
<text x="140" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min ?</text>
<rect x="230" y="70" width="120" height="140" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="290" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79" font-family="Segoe UI,Noto Sans,sans-serif">split</text>
