<circle cx="278" cy="141" r="4" fill="#1f4e79"/>
<circle cx="304" cy="153" r="4" fill="#1f4e79"/>
<circle cx="310" cy="159" r="4" fill="#1f4e79"/>
<circle cx="306" cy="149" r="4" fill="#1f4e79"/>
<text x="290" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min ?</text>
<rect x="380" y="70" width="120" height="140" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="440" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">outlier</text>
<circle cx="440" cy="145" r="4" fill="#b45309"/>
<circle cx="446" cy="149" r="4" fill="#b45309"/>
<circle cx="436" cy="151" r="4" fill="#b45309"/>
<circle cx="468" cy="123" r="4" fill="#b45309"/>
<circle cx="438" cy="139" r="4" fill="#b45309"/>
<text x="440" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min ?</text>
<rect x="530" y="70" width="120" height="140" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="6"/>
<text x="590" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#7b1fa2" font-family="Segoe UI,Noto Sans,sans-serif">wide</text>
<circle cx="566" cy="129" r="4" fill="#7b1fa2"/>
<circle cx="612" cy="127" r="4" fill="#7b1fa2"/>
<circle cx="570" cy="163" r="4" fill="#7b1fa2"/>
<circle cx="614" cy="165" r="4" fill="#7b1fa2"/>
<circle cx="590" cy="147" r="4" fill="#7b1fa2"/>
<text x="590" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">D_min ?</text>
<text x="16" y="250" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Possible: same D_min (structure is cost only), or D_min shifts with layout.</text>
