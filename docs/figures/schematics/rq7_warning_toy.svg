<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-label="RQ7 early warning toy">
<rect x="0" y="0" width="720" height="275" fill="#f7f6f2"/>
<text x="16" y="24" text-anchor="start" font-size="14" font-weight="700" fill="#1c1b19" font-family="Segoe UI,Noto Sans,sans-serif">Toy: early warning timeline (RQ7)</text>
<text x="16" y="44" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Can recent state warn of failure better than knowing only N and D?</text>
<rect x="40" y="80" width="640" height="150" fill="#fff" stroke="#bbb3a5" stroke-width="1" rx="0"/>
<line x1="70" y1="190" x2="650" y2="190" stroke="#5c5852" stroke-width="1"/>
<text x="360" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">tick</text>
<rect x="320" y="95" width="280" height="85" fill="#b45309" rx="0" opacity="0.12"/>
<text x="460" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309" font-family="Segoe UI,Noto Sans,sans-serif">check window (toy)</text>
<line x1="70" y1="140" x2="150" y2="140" stroke="#2f6b45" stroke-width="3"/>
<circle cx="150" cy="140" r="5" fill="#2f6b45"/>
<text x="150" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b45" font-family="Segoe UI,Noto Sans,sans-serif">success ends early</text>
<line x1="70" y1="165" x2="620" y2="165" stroke="#9b2c2c" stroke-width="3"/>
<circle cx="620" cy="165" r="5" fill="#9b2c2c"/>
<text x="560" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#9b2c2c" font-family="Segoe UI,Noto Sans,sans-serif">failure to timeout</text>
<text x="16" y="255" text-anchor="start" font-size="11" font-weight="400" fill="#5c5852" font-family="Segoe UI,Noto Sans,sans-serif">Useful warning needs successes and failures still overlapping in the check window.</text>
</svg>