# Phase-1 claim windows (RQ2 / Package A).
# Grade: CLAIM. Run only after phase1/scout/trials.csv exists.
#
# The runner does not execute this full grid. plan_claim_cells.py keeps, per N:
# the scout D_min and its grid neighbors, and when the scout shows two
# consecutive D below theta, those two plus the last D still at or above theta.
# If no D meets theta, the two largest D only. Seeds are 100.
# Analysis uses merged_trials.csv: claim rows replace scout rows on those cells.

protocol_id: phase1_claim
phase: 1
grade: CLAIM
output: scaling/results/phase1/claim
canonical: scaling/configs/canonical_grid.yaml

methods:
  - strombom_multi
layouts:
  - compact
flock_sizes: [5, 10, 25, 50, 75, 100, 150, 200, 300, 400]
shepherd_counts: [1, 2, 3, 4, 6, 10, 15, 20, 25, 35]
seeds: 100
seed_mode: claim
# Scout map that supplies the reliability curve for window selection.
upstream_protocol: phase1_scout
store_timeseries: true
packages: [A, F]
