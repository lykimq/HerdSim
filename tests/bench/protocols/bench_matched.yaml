# Bench campaign: the field-matched sheep set (Strombom et al. 2014, real-flock comparison:
# r_a 1, noise 0.1, reaction distance 75) through the real pipeline. The layout scale follows r_a.
protocol_id: bench_matched
output: results/bench_matched
canonical: protocols/configs/canonical.yaml

methods:
  strombom_multi:
    time_limit_drive_multiple: 8.0
    params: {r_a: 1.0, noise_strength: 0.1, r_s: 75.0}

separation_scale: 1.0
dog_overlap_distance: 1.0

layouts: [compact, wide]
flock_sizes: [100]
shepherd_counts: [1, 4]

reliability_theta: 0.5
confidence: 0.9
batch_seeds: 5
max_seeds: 5
timeseries_seeds: 0
budget_hours: 0.5
