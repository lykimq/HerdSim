# Phase-2 structure claim windows (RQ1 / Package B).
# Grade: CLAIM. After phase2/scout/trials.csv exists.
#
# Why extends scout: same N/D/layouts/method; only grade and seeds change.
# Why 100 seeds: claim depth at R~0.90; raise a window to 200 only if that
# window's D_min bootstrap interval covers more than one grid step.
# Why per-(layout, N) windows (same rule as Phase 1): each layout has its
# own frontier; a flat 100-seed full grid spends the draft budget on
# interiors that do not move D_min.
# Why upstream phase2_scout: plan from scout trials; analyse merged_trials.

extends: phase2_scout.yaml
protocol_id: phase2_claim
grade: CLAIM
output: results/phase2/claim
seeds: 100
seed_mode: claim
upstream_protocol: phase2_scout
packages: [B]
