[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herdsim"
version = "0.1.0"
description = "Scaling CLI and analysis for multi-agent shepherding research questions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "basedpyright>=1.18",
]

# Shared engine at repo root; scaling services mapped for services.scaling imports.
[tool.setuptools]
packages = [
    "analysis",
    "analysis.scaling",
    "core",
    "core.agents",
    "methods",
    "methods.flocking_dog",
    "methods.heterogeneous",
    "methods.kubo",
    "methods.obstacle_aware",
    "methods.strombom",
    "methods.strombom_multi",
    "methods.strombom_noise",
    "methods.v_formation",
    "plugins",
    "plugins.dogs",
    "plugins.metrics",
    "plugins.scenarios",
    "plugins.sheep",
    "services.scaling",
    "services.shared",
]

[tool.setuptools.package-dir]
"services.scaling" = "scaling/services/scaling"
"services.shared" = "services/shared"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = [".", "scaling"]
markers = [
    "stress: heavy / long runs; use make test-stress",
]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [".", "scaling"]
venvPath = "."
venv = ".venv"
failOnWarnings = false
