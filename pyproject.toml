[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herdsim"
version = "1.0"
description = "Scaling CLI and analysis for multi-agent shepherding research questions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "basedpyright>=1.18",
    "pandas-stubs>=2.1",
    "scipy-stubs>=1.11",
]

# Import names stay stable (core / plugins.* / methods.*); folders under sim/ are purpose-split.
[tool.setuptools]
packages = [
    "analysis",
    "core",
    "core.config",
    "core.world",
    "methods",
    "methods.kubo",
    "methods.strombom",
    "plugins",
    "plugins.dogs",
    "plugins.metrics",
    "plugins.scenarios",
    "plugins.sheep",
    "protocols",
    "protocols.packaging",
    "services",
]

[tool.setuptools.package-dir]
"core" = "sim/core"
"core.config" = "sim/core/config"
"core.world" = "sim/core/world"
"methods" = "sim/methods"
"methods.kubo" = "sim/methods/kubo"
"methods.strombom" = "sim/methods/strombom"
"plugins" = "sim/plugins"
"plugins.dogs" = "sim/plugins/dogs"
"plugins.metrics" = "sim/plugins/metrics"
"plugins.scenarios" = "sim/plugins/scenarios"
"plugins.sheep" = "sim/plugins/sheep"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "stress: heavier / longer runs (included in make test)",
]

# Typecheck settings live in pyrightconfig.json (basedpyright reads that first).
[tool.pyright]
pythonVersion = "3.11"
