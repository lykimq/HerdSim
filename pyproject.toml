[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herdsim"
version = "1.0"
description = "Scaling CLI and analysis for multi-agent shepherding research questions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "basedpyright>=1.18",
    "pandas-stubs>=2.1",
    "scipy-stubs>=1.11",
]

[tool.setuptools.packages.find]
include = ["sim*", "services*", "protocols*", "analysis*", "records*", "report*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The figure scripts in docs/figures are linted like the rest of the code, so their
# structure does not drift. Gitignored local folders are skipped, as ruff respects .gitignore.

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Benchmarks are slow; `make bench` runs them, `make test` does not.
addopts = "-m 'not bench'"
markers = ["bench: behaviour and performance benchmarks, run with `make bench`"]

# Typecheck settings live in pyrightconfig.json.
