# Phase-5 information factor sweep (RQ5).
# Grade: SCOUT subset. Observation-mode ladder by default.

campaign_id: phase5_factor_sweep
phase: 5
grade: SCOUT
output: results/budget/phase5/factor_sweep
protocol: configs/budget/canonical_grid.yaml

instrument: strombom_multi
layouts:
  - compact
flock_sizes: [50, 100]
shepherd_counts: [1, 2, 3, 4, 6, 10]
seeds: 10
obs_modes:
  - bearing_only
  - local_positions
  - global
store_timeseries: false
packages: [E]
